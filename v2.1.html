/* ---------- router ---------- */
const ROUTES = [];
function route(pattern, handler){
  const keys = []; const re = new RegExp('^' + pattern.replace(/:(\w+)/g, (_, k) => { keys.push(k); return '([^/]+)'; }) + '$');
  ROUTES.push({re, keys, handler});
}
function parseHash(){
  const raw = (location.hash || '#/').slice(1);
  const [pathPart, queryPart] = raw.split('?');
  const path = pathPart || '/';
  const query = {};
  if(queryPart) queryPart.split('&').forEach(p => { const [k, v] = p.split('='); if(k) query[decodeURIComponent(k)] = decodeURIComponent(v || ''); });
  return {path, query};
}
function navigate(path){ location.hash = '#' + path; }
async function render(){
  const {path, query} = parseHash();
  const found = ROUTES.map(r => ({r, m: r.re.exec(path)})).find(x => x.m);
  const app = $('#app');
  $$('#mainNav [data-nav]').forEach(a => a.classList.toggle('active', a.dataset.nav === path));
  $('#mainNav').classList.remove('nav-open'); $('#toolsDd') && $('#toolsDd').classList.remove('open');
  document.querySelector('.site-header').classList.remove('nav-open');
  window.scrollTo(0, 0);
  if(!found){ app.innerHTML = notFoundPage(); renderHeaderFooter(); return; }
  const params = {}; found.r.keys.forEach((k, i) => params[k] = decodeURIComponent(found.m[i + 1]));
  try { await found.r.handler({params, query}); }
  catch(e){ console.error(e); app.innerHTML = '<div class="container section"><div class="alert alert-err">Something went wrong rendering this page: ' + esc(e.message) + '</div></div>'; }
  renderHeaderFooter();
}

function addToCart(pid, qty = 1){
  const p = byId('products', pid);
  if(!p || p.status !== 'active') return toast('Product not found', 'err');
  if(p.stock <= 0) return toast('This product is out of stock', 'err');
  const line = CART.items.find(i => i.product_id === pid);
  const already = line ? line.qty : 0;
  const finalQty = Math.min(p.stock, already + qty);
  if(finalQty === already) return toast('No more stock available for this item', 'warn');
  if(line) line.qty = finalQty; else CART.items.push({product_id:pid, qty:finalQty});
  saveCart(); renderHeaderFooter(); toast(p.name + ' added to cart', 'ok');
}
function toggleWish(pid){
  if(!requireLogin(location.hash.slice(1))) return;
  const u = currentUser();
  const existing = DB.wishlist.find(w => w.customer_id === u.id && w.product_id === pid);
  if(existing){ deleteRows('wishlist', [existing]); toast('Removed from wishlist'); }
  else { DB.wishlist.push({id:nextId('wishlist'), customer_id:u.id, product_id:pid, created_at:nowStr()}); toast('Added to wishlist', 'ok'); }
  saveDB(); render();
}
function toggleCompare(pid){
  if(!requireLogin(location.hash.slice(1))) return;
  const u = currentUser();
  const existing = DB.compare_list.find(w => w.customer_id === u.id && w.product_id === pid);
  if(existing){ deleteRows('compare_list', [existing]); toast('Removed from compare list'); }
  else {
    if(DB.compare_list.filter(w => w.customer_id === u.id).length >= 4) return toast('You can compare up to 4 products at a time', 'warn');
    DB.compare_list.push({id:nextId('compare_list'), customer_id:u.id, product_id:pid}); toast('Added to compare list', 'ok');
  }
  saveDB(); render();
}

    });

    $('#backStep2').addEventListener('click', () => { CHECK_STEP = 2; renderCheckout(lines); });
    $('#placeOrder').addEventListener('click', () => {
      const btn = $('#placeOrder'); btn.disabled = true; btn.textContent = 'Placing order…';
      setTimeout(() => {
        try{
          const items = lines.map(l => ({product_id:l.product.id, quantity:l.qty}));
          const r = createOrder({customerId:currentUser().id, items, address:addrStr, payment:CHECKOUT.payment, coupon:CART.coupon});
          CART = {items:[], coupon:null}; saveCart(); CHECKOUT = {shipping:null, payment:'card'}; saveCheckout();
          navigate('/order-success/' + r.order.id);
        }catch(err){ toast(err.message || 'Could not place order', 'err'); btn.disabled = false; btn.textContent = '✅ Place order — ' + money(tot.total); }
      }, 500);
    });

function showFormErrors(formId, errors){

/* ---------- generic CRUD module ---------- */
const PAGE_SIZE = 8;
function moduleRows(tbl){
  const m = MODULES[tbl]; let rows = DB[tbl].slice();
  if(ADMIN_STATE.search){
    const q = ADMIN_STATE.search.toLowerCase();
    rows = rows.filter(r => m.cols.some(c => String(r[c.k] == null ? '' : r[c.k]).toLowerCase().includes(q)) || String(r.id) === q);
  }
  return rows.slice().sort((a, b) => b.id - a.id);
}
function cellHtml(tbl, col, r){
  const v = r[col.k];
  if(col.img) return imgTag(v, 'thumb', 'thumb-sm');
  if(col.badge) return statusBadgeAny(v);
  if(col.cat) return esc(catName(v));
  if(col.prod) { const p = byId('products', v); return esc(p ? p.name : '#' + v); }
  if(col.money) return money(v);
  if(col.stars) return '★'.repeat(v) + '☆'.repeat(5 - v);
  if(col.mth) return '<span class="mth m-' + esc(v) + '">' + esc(v) + '</span>';
  return esc(v == null ? '—' : v);
}
function statusBadgeAny(v){
  const map = {active:'b-ok', inactive:'b-gray', blocked:'b-err', admin:'b-info', customer:'b-gray', approved:'b-ok', pending:'b-warn', rejected:'b-err'};
  return '<span class="badge ' + (map[v] || 'b-gray') + '">' + esc(v) + '</span>';
}
function renderAdminModule(tbl){
  const m = MODULES[tbl];
  const rows = moduleRows(tbl);
  const pages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
  ADMIN_STATE.page = Math.min(ADMIN_STATE.page, pages);
  const pageRows = rows.slice((ADMIN_STATE.page - 1) * PAGE_SIZE, ADMIN_STATE.page * PAGE_SIZE);
  $('#adminMain').innerHTML =
  '<div class="toolbar"><h2 style="margin:0">' + m.icon + ' ' + m.label + ' <span class="muted small">(' + rows.length + ')</span></h2>' +

function openModuleForm(tbl, rec){

}

/* ---------- ER Diagram ---------- */
function erLayout(){
  const cols = 3;
  const boxW = 220, colGap = 70, rowGap = 46, headerH = 28, rowH = 17, pad = 12;
  const heights = {}; TABLE_NAMES.forEach(t => { heights[t] = headerH + SCHEMA[t].length * rowH + pad; });
  const positions = {}; const colY = new Array(cols).fill(20);
  TABLE_NAMES.forEach((t, idx) => {
    const c = idx % cols;
    positions[t] = {x:20 + c * (boxW + colGap), y:colY[c], w:boxW, h:heights[t]};
    colY[c] += heights[t] + rowGap;
  });
  return {positions, totalW:cols * (boxW + colGap) + 20, totalH:Math.max(...colY) + 20, boxW};
}
function renderErSvg(){
  const {positions, totalW, totalH} = erLayout();
  let boxesSvg = '', linesSvg = '';
  FKS.forEach(fk => {
    const from = positions[fk.t], to = positions[fk.rt];
    if(!from || !to) return;
    const x1 = from.x + from.w, y1 = from.y + 14, x2 = to.x, y2 = to.y + 14;
    const midx = (x1 + x2) / 2, midy = (y1 + y2) / 2;
    linesSvg += '<path d="M ' + x1 + ' ' + y1 + ' C ' + (x1 + 45) + ' ' + y1 + ', ' + (x2 - 45) + ' ' + y2 + ', ' + x2 + ' ' + y2 + '" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#erArrow)"/>' +
      '<rect x="' + (midx - fk.c.length * 3 - 4) + '" y="' + (midy - 12) + '" width="' + (fk.c.length * 6 + 8) + '" height="14" rx="4" fill="#fff" stroke="#e6e1f3"/>' +
      '<text x="' + midx + '" y="' + (midy - 2) + '" font-size="9" fill="#6d28d9" text-anchor="middle" font-family="monospace">' + esc(fk.c) + '</text>';
  });
  TABLE_NAMES.forEach(t => {
    const p = positions[t]; const cols = SCHEMA[t];
    boxesSvg += '<g>' +
      '<rect x="' + p.x + '" y="' + p.y + '" width="' + p.w + '" height="' + p.h + '" rx="9" fill="#fff" stroke="#c4b5fd" stroke-width="1.5"/>' +
      '<rect x="' + p.x + '" y="' + p.y + '" width="' + p.w + '" height="28" rx="9" fill="#6d28d9"/>' +
      '<rect x="' + p.x + '" y="' + (p.y + 14) + '" width="' + p.w + '" height="14" fill="#6d28d9"/>' +
      '<text x="' + (p.x + 10) + '" y="' + (p.y + 19) + '" fill="#fff" font-weight="700" font-size="12.5" font-family="monospace">' + esc(t) + '</text>' +
      cols.map((c, i) => '<text x="' + (p.x + 10) + '" y="' + (p.y + 28 + 17 * (i + 1) - 4) + '" font-size="10.5" font-family="monospace" fill="' + (c.k === 'PRI' ? '#b45309' : c.k === 'MUL' ? '#6d28d9' : '#333') + '">' + (c.k === 'PRI' ? '🔑' : c.k === 'MUL' ? '↳' : '·') + ' ' + esc(c.n) + ' <tspan fill="#999">' + esc(c.t.split('(')[0].toLowerCase()) + '</tspan></text>').join('') +
      '</g>';
  });
  return '<svg viewBox="0 0 ' + totalW + ' ' + totalH + '" width="100%" style="min-width:900px;height:auto;display:block;background:#faf8ff">' +
    '<defs><marker id="erArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#a78bfa"/></marker></defs>' +
    linesSvg + boxesSvg + '</svg>';
}

function freshTab(seed){
  const t = Object.assign({
    id: uid(), name:'Untitled request', method:'GET', url:'{{cl_url}}/products',
    params:[], headers:[], body:'{\n  \n}', bodyMode:'none', rawType:'json', formData:[], urlenc:[], gqlQuery:PM_GQL_SAMPLE, gqlVars:'', binFile:null, auth:false, authType:'none', authData:{}, locals:[],
    preRequest:'', tests: PM_TEST_SNIPPET, activeReqTab:'params', response:null, saved:true
  }, seed || {});
  if(seed && seed.auth && !seed.authType){ t.authType = 'bearer'; t.authData = {token:'{{token}}'}; }
  t.locals = JSON.parse(JSON.stringify(t.locals || [])); t.authData = JSON.parse(JSON.stringify(t.authData || {}));
  if(t.bodyMode === 'json') t.bodyMode = 'raw';
  if(!['none', 'form-data', 'urlenc', 'raw', 'binary', 'graphql'].includes(t.bodyMode)) t.bodyMode = 'none';
  ['formData', 'urlenc'].forEach(k => { t[k] = JSON.parse(JSON.stringify(t[k] || [])); });
  t.binFile = t.binFile ? JSON.parse(JSON.stringify(t.binFile)) : null;
  return t;
}
function tabFromCollection(item){
  const seed = {name:item.name, method:item.method, url:item.url, body:item.body ? JSON.stringify(item.body, null, 2) : '{\n  \n}', bodyMode:item.formData ? 'form-data' : item.urlenc ? 'urlenc' : item.gql ? 'graphql' : item.body ? 'raw' : 'none', formData:item.formData || [], urlenc:item.urlenc || [], gqlQuery:item.gql ? item.gql.query : PM_GQL_SAMPLE, gqlVars:item.gql ? (item.gql.vars || '') : '',
    tests:item.tests !== undefined ? item.tests : PM_TEST_SNIPPET, preRequest:item.pre || '', noAutoToken:!!item.noAutoToken};
  if(item.auth || item.admin){ seed.authType = 'bearer'; seed.authData = {token:item.admin ? '{{admin_token}}' : '{{token}}'}; seed.need = item.admin ? 'admin' : 'customer'; }
  const t = freshTab(seed);
  const u = new URL(item.url.replace(/\{\{[^}]*\}\}/g, 'x'));
  t.params = Array.from(u.searchParams.entries()).map(([k, v]) => ({key:k, value:v, on:true}));

    const inp = bd.querySelector('[name=v]'); inp.focus(); inp.select();

    (r.row ? '<div>' + Object.entries(r.row).map(([k, v]) => '<span class="chip">' + esc(k) + ' = ' + esc(v) + '</span>').join('') + '</div>' : '') + '</div>' +
    '<div class="pm-rtabs">' + tabs.map(([k, l]) => '<button class="' + (R.dtab === k ? 'active' : '') + '" data-rd="' + k + '">' + l + '</button>').join('') + '</div><div class="rd-body">' + body + '</div>';
  $$('[data-rd]', det).forEach(b => b.addEventListener('click', () => { R.dtab = b.dataset.rd; paintRunnerResults(); }));
}
/* =====================================================================
   /* =====================================================================
   PERFORMANCE LAB – a real JMeter-style Test Plan tree.
   Build a tree (Test Plan > Thread Group > HTTP Request / Timer /
   Config Element / Listener) exactly like desktop JMeter: use "+ Add" to
   add children valid for whatever is selected, configure each element in
   the panel on the right, then Run. Listeners (View Results Tree,
   Aggregate Report, Summary Report) collect results from samplers in
   their scope (their own Thread Group, or every group if attached to the
   Test Plan root) — the same scoping rule real JMeter uses.
   ===================================================================== */
const PERF_MAX_OPS = 400;
const JM_ICON = {TestPlan:'🧪', ThreadGroup:'⚙️', HTTPRequest:'🌐', HTTPRequestDefaults:'🧰', HTTPHeaderManager:'📑', UserDefinedVariables:'📋', UniformRandomTimer:'⏱️', ResponseAssertion:'🎯', ViewResultsTree:'🌳', AggregateReport:'📊', SummaryReport:'📈'};
const JM_LABEL = {TestPlan:'Test Plan', ThreadGroup:'Thread Group', HTTPRequest:'HTTP Request', HTTPRequestDefaults:'HTTP Request Defaults', HTTPHeaderManager:'HTTP Header Manager', UserDefinedVariables:'User Defined Variables', UniformRandomTimer:'Uniform Random Timer', ResponseAssertion:'Response Assertion', ViewResultsTree:'View Results Tree', AggregateReport:'Aggregate Report', SummaryReport:'Summary Report'};
const JM_ALLOWED_CHILDREN = {
  TestPlan: ['ThreadGroup', 'HTTPRequestDefaults', 'HTTPHeaderManager', 'UserDefinedVariables', 'ViewResultsTree', 'AggregateReport', 'SummaryReport'],
  ThreadGroup: ['HTTPRequest', 'HTTPRequestDefaults', 'HTTPHeaderManager', 'UserDefinedVariables', 'UniformRandomTimer', 'ResponseAssertion', 'ViewResultsTree', 'AggregateReport', 'SummaryReport'],
  HTTPRequest: [], HTTPRequestDefaults: [], HTTPHeaderManager: [], UserDefinedVariables: [], UniformRandomTimer: [], ResponseAssertion: [], ViewResultsTree: [], AggregateReport: [], SummaryReport: []
};
const JM_LISTENER_TYPES = ['ViewResultsTree', 'AggregateReport', 'SummaryReport'];
const JM_CONFIG_TYPES = ['HTTPRequestDefaults', 'HTTPHeaderManager', 'UserDefinedVariables'];

function jmNewNode(type, extra){ return Object.assign({id:'n_' + uid(), type, name:JM_LABEL[type], children:[]}, extra || {}); }
function jmNewThreadGroup(kind){
  const names = {normal:'Thread Group', setUp:'setUp Thread Group', tearDown:'tearDown Thread Group'};
  return jmNewNode('ThreadGroup', {name:names[kind] || 'Thread Group', kind:kind || 'normal', users:5, rampup:2, loops:1, infinite:false, sameUser:true, specifyLifetime:false, duration:60, startupDelay:0, errorAction:'continue'});
}
function jmNewHttpRequest(){ return jmNewNode('HTTPRequest', {protocol:'https', server:'api.qasandbox.com', port:'', method:'GET', path:'/v1/products', params:[{key:'page', value:'1', on:true}, {key:'limit', value:'10', on:true}], bodyMode:'params', body:'{\n  \n}'}); }
function jmNewHttpDefaults(){ return jmNewNode('HTTPRequestDefaults', {protocol:'https', server:'api.qasandbox.com', port:''}); }
function jmNewHeaderManager(){ return jmNewNode('HTTPHeaderManager', {headers:[{key:'Content-Type', value:'application/json', on:true}]}); }
function jmNewUdv(){ return jmNewNode('UserDefinedVariables', {vars:[{key:'baseVar', value:'demo', on:true}]}); }
function jmNewTimer(){ return jmNewNode('UniformRandomTimer', {delay:100, randomDelay:300}); }
function jmNewAssertion(){ return jmNewNode('ResponseAssertion', {field:'code', mode:'equals', pattern:'200'}); }
function jmNewListener(type){ return jmNewNode(type, {results:[]}); }

function seedPerfTree(){
  const httpReq = jmNewHttpRequest();
  const vrt = jmNewListener('ViewResultsTree');
  const agg = jmNewListener('AggregateReport');
  const tg = jmNewThreadGroup('normal');
  tg.children = [httpReq, vrt, agg];
  return jmNewNode('TestPlan', {id:'testplan', children:[tg]});
}
function jmStrip(n){ const c = Object.assign({}, n); delete c._collapsed; if(c.results) c.results = []; if(c.children) c.children = c.children.map(jmStrip); return c; }
function savePerfTree(){ store.set(LS.perftree, jmStrip(PERF_TREE)); }
function jmFindNode(node, id){ if(node.id === id) return node; for(const c of (node.children || [])){ const f = jmFindNode(c, id); if(f) return f; } return null; }
function jmFindParent(node, id, parent){ if(node.id === id) return parent; for(const c of (node.children || [])){ const f = jmFindParent(c, id, node); if(f) return f; } return null; }
function jmEnsureResults(node){ (node.children || []).forEach(jmEnsureResults); if(JM_LISTENER_TYPES.includes(node.type) && !Array.isArray(node.results)) node.results = []; }

let PERF_TREE = store.get(LS.perftree, null);
if(!PERF_TREE || !PERF_TREE.children) PERF_TREE = seedPerfTree();
jmEnsureResults(PERF_TREE);
let SELECTED_NODE_ID = PERF_TREE.children[0] ? PERF_TREE.children[0].id : PERF_TREE.id;
let PERF_RUN = {running:false, stopFlag:false, startTs:0};
let VRT_SELECTED = {}; /* per-listener-node selected sample index */

route('/performance', () => { renderPerf(); });

function jmClearResults(node){ if(JM_LISTENER_TYPES.includes(node.type)) node.results = []; (node.children || []).forEach(jmClearResults); }

/* ---------- tree rendering ---------- */
function paintJmTree(){
  const root = $('#jmTree'); if(!root) return;
  root.innerHTML = jmRenderNode(PERF_TREE, 0);
  $$('.jm-node', root).forEach(el => el.addEventListener('click', e => { e.stopPropagation(); selectNode(el.dataset.id); }));
  $$('.jm-caret', root).forEach(el => el.addEventListener('click', e => { e.stopPropagation(); const node = jmFindNode(PERF_TREE, el.closest('.jm-node').dataset.id); node._collapsed = !node._collapsed; paintJmTree(); }));
}
function jmRenderNode(node, depth){
  const hasChildren = node.children && node.children.length;
  const collapsed = !!node._collapsed;
  let html = '<div class="jm-node' + (node.id === SELECTED_NODE_ID ? ' selected' : '') + '" data-id="' + node.id + '" style="padding-left:' + (depth * 16 + 6) + 'px" title="' + esc(JM_LABEL[node.type]) + '">' +
    (hasChildren ? '<span class="jm-caret">' + (collapsed ? '▶' : '▼') + '</span>' : '<span class="jm-caret" style="visibility:hidden">▶</span>') +
    '<span class="jm-icon">' + JM_ICON[node.type] + '</span><span class="jm-name">' + esc(node.name) + '</span>' +
    '</div>';
  if(hasChildren && !collapsed) html += node.children.map(c => jmRenderNode(c, depth + 1)).join('');
  return html;
}
function selectNode(id){ SELECTED_NODE_ID = id; paintJmTree(); paintConfigPanel(); }

/* ---------- add / remove ---------- */
function paintAddMenu(){
  const node = jmFindNode(PERF_TREE, SELECTED_NODE_ID) || PERF_TREE;
  const allowed = JM_ALLOWED_CHILDREN[node.type] || [];
  const menu = $('#jmAddMenu');
  if(!allowed.length){ menu.innerHTML = '<div class="muted small" style="padding:8px 12px">"' + esc(node.name) + '" can\'t contain child elements. Select the Test Plan or a Thread Group first.</div>'; return; }
  const items = [];
  allowed.forEach(t => {
    if(t === 'ThreadGroup') items.push({t:'ThreadGroup:normal', label:JM_ICON.ThreadGroup + ' Thread Group'}, {t:'ThreadGroup:setUp', label:JM_ICON.ThreadGroup + ' setUp Thread Group'}, {t:'ThreadGroup:tearDown', label:JM_ICON.ThreadGroup + ' tearDown Thread Group'});
    else items.push({t, label:JM_ICON[t] + ' ' + JM_LABEL[t]});
  });
  menu.innerHTML = items.map(it => '<a href="#" data-add="' + it.t + '">' + it.label + '</a>').join('');
  $$('[data-add]', menu).forEach(a => a.addEventListener('click', e => {
    e.preventDefault();
    const [type, kind] = a.dataset.add.split(':');
    let child;
    if(type === 'ThreadGroup') child = jmNewThreadGroup(kind);
    else if(type === 'HTTPRequest') child = jmNewHttpRequest();
    else if(type === 'HTTPRequestDefaults') child = jmNewHttpDefaults();
    else if(type === 'HTTPHeaderManager') child = jmNewHeaderManager();
    else if(type === 'UserDefinedVariables') child = jmNewUdv();
    else if(type === 'UniformRandomTimer') child = jmNewTimer();
    else if(type === 'ResponseAssertion') child = jmNewAssertion();
    else child = jmNewListener(type);
    node.children.push(child); node._collapsed = false;
    SELECTED_NODE_ID = child.id;
    savePerfTree(); paintJmTree(); paintConfigPanel();
    $$('.dropdown.open').forEach(d => d.classList.remove('open'));
  }));
}
function jmRemoveSelected(){
  if(SELECTED_NODE_ID === PERF_TREE.id) return toast('The Test Plan root cannot be removed', 'warn');
  const parent = jmFindParent(PERF_TREE, SELECTED_NODE_ID, null);
  if(!parent) return;
  const node = jmFindNode(PERF_TREE, SELECTED_NODE_ID);
  confirmDelete({title:'Remove "' + node.name + '"?', body:'This also removes everything inside it. This cannot be undone.', onConfirm: () => {
    parent.children = parent.children.filter(c => c.id !== SELECTED_NODE_ID);
    SELECTED_NODE_ID = parent.id;
    savePerfTree(); paintJmTree(); paintConfigPanel(); toast('Removed', 'ok');
  }});
}

/* ---------- HTTP Request config (matches the "get access token" screenshot) ---------- */
function jmKvTable(rows, prefix){
  return '<table class="kvt"><thead><tr><th style="width:34px"></th><th>Name</th><th>Value</th><th style="width:34px"></th></tr></thead><tbody>' +
  rows.map((r, i) => '<tr><td class="ck"><input type="checkbox" data-' + prefix + 'row="' + i + '" ' + (r.on ? 'checked' : '') + '></td><td><input type="text" data-' + prefix + 'key="' + i + '" value="' + esc(r.key) + '" placeholder="name"></td><td><input type="text" data-' + prefix + 'val="' + i + '" value="' + esc(r.value) + '" placeholder="value"></td><td class="dl"><button data-' + prefix + 'del="' + i + '">🗑</button></td></tr>').join('') +
  '<tr><td></td><td><input type="text" data-' + prefix + 'newkey placeholder="name"></td><td><input type="text" data-' + prefix + 'newval placeholder="value"></td><td></td></tr></tbody></table>';
}
function wireJmKv(container, arr, prefix, onChange){
  container.querySelectorAll('[data-' + prefix + 'row]').forEach(el => el.addEventListener('change', () => { arr[Number(el.dataset[prefix + 'row'])].on = el.checked; onChange(); }));
  container.querySelectorAll('[data-' + prefix + 'key]').forEach(el => el.addEventListener('input', () => { arr[Number(el.dataset[prefix + 'key'])].key = el.value; onChange(); }));
  container.querySelectorAll('[data-' + prefix + 'val]').forEach(el => el.addEventListener('input', () => { arr[Number(el.dataset[prefix + 'val'])].value = el.value; onChange(); }));
  container.querySelectorAll('[data-' + prefix + 'del]').forEach(el => el.addEventListener('click', () => { arr.splice(Number(el.dataset[prefix + 'del']), 1); onChange(); paintConfigPanel(); }));
  const nk = container.querySelector('[data-' + prefix + 'newkey]'), nv = container.querySelector('[data-' + prefix + 'newval]');
  const maybeCommit = () => setTimeout(() => {
    const active = document.activeElement;
    if(active === nk || active === nv) return;
    if((nk.value && nk.value.trim()) || (nv.value && nv.value.trim())){ arr.push({key:nk.value.trim(), value:nv.value.trim(), on:true}); onChange(); paintConfigPanel(); }
  }, 0);
  if(nk) nk.addEventListener('blur', maybeCommit); if(nv) nv.addEventListener('blur', maybeCommit);
}

  '<div class="field"><label>Server Name or IP</label><input type="text" id="cfgServer" value="' + esc(node.server) + '" placeholder="inherits from HTTP Request Defaults if blank"></div>' +

    '<div id="cfgBodyWrap" style="display:' + (node.bodyMode === 'raw' ? 'block' : 'none') + '"><label class="small" style="font-weight:700">Body Data</label><textarea class="code-area" id="cfgBody" style="min-height:120px">' + esc(node.body) + '</textarea></div>' : '') +
  '<div class="alert alert-info small mt">Effective request (headers come from any HTTP Header Manager in scope; server/port fall back to HTTP Request Defaults in scope): <b><span id="cfgPreviewMethod"></span> <span id="cfgPreviewUrl"></span></b></div>';
  wireName(node);

  $('#cfgProtocol').addEventListener('change', e => { node.protocol = e.target.value; update(); });

  $('#cfgPort').addEventListener('input', e => { node.port = e.target.value; update(); });
  $('#cfgMethod').addEventListener('change', e => { node.method = e.target.value; savePerfTree(); paintConfigPanel(); });
  $('#cfgPath').addEventListener('input', e => { node.path = e.target.value; update(); });
  wireJmKv(p, node.params, 'p', () => { savePerfTree(); updatePreview(); });
  $$('input[name="cfgBodyMode"]').forEach(r => r.addEventListener('change', e => { node.bodyMode = e.target.value; const w = $('#cfgBodyWrap'); if(w) w.style.display = e.target.value === 'raw' ? 'block' : 'none'; update(); }));

  '<div class="jm-radio-row"><label><input type="radio" name="assertField" value="code" ' + (node.field === 'code' ? 'checked' : '') + '> Response Code</label><label><input type="radio" name="assertField" value="body" ' + (node.field === 'body' ? 'checked' : '') + '> Response Body (text)</label></div>' +

  '<div class="field"><label>Pattern to test</label><input type="text" id="cfgPattern" value="' + esc(node.pattern) + '" placeholder="' + (node.field === 'code' ? 'e.g. 200' : 'e.g. \"success\":true') + '"></div>';

  $$('input[name="assertField"]').forEach(r => r.addEventListener('change', e => { node.field = e.target.value; savePerfTree(); paintConfigPanel(); }));

function paintListenerConfig(node, head){
  const p = $('#jmConfig');
  const results = node.results || [];
  const exportBtn = '<button class="btn btn-sm" id="cfgExportCsv">⬇ Export (CSV)</button>';
  if(node.type === 'ViewResultsTree'){
    p.innerHTML = head + '<p class="muted small">Shows every sample this listener\'s scope has recorded, most recent first. Click a row to inspect its request and response, exactly like JMeter\'s View Results Tree.</p>' +
    '<div class="row mt" style="margin-bottom:10px">' + exportBtn + '<span class="muted small">' + results.length + ' sample(s)</span></div>' +
    '<div class="row" style="align-items:flex-start;gap:14px">' +
    '<div class="vrt-list" id="vrtList"></div>' +
    '<div style="flex:1;min-width:0" id="vrtDetail"></div>' +
    '</div>';
    paintVrtList(node);
    $('#cfgExportCsv').addEventListener('click', () => exportListenerCsv(node));
    return;
  }
  /* AggregateReport & SummaryReport share the same table, SummaryReport shows fewer columns like real JMeter */
  const full = node.type === 'AggregateReport';
  const byLabel = {};
  results.forEach(r => { (byLabel[r.label] = byLabel[r.label] || []).push(r); });
  const labels = Object.keys(byLabel);
  const cols = full ? ['Label', '# Samples', 'Average', 'Min', 'Max', 'Std. Dev.', 'p95', 'Error %', 'Throughput'] : ['Label', '# Samples', 'Average', 'Min', 'Max', 'Error %', 'Throughput'];
  const rows = labels.map(label => {
    const arr = byLabel[label]; const times = arr.map(r => r.ms).slice().sort((a, b) => a - b);
    const avg = times.reduce((a, b) => a + b, 0) / times.length;
    const errs = arr.filter(r => r.error).length;
    const durSec = Math.max(0.001, (arr[arr.length - 1].ts - arr[0].ts) / 1000);
    const throughput = Math.round((arr.length / (durSec || (times[0] / 1000) || 1)) * 10) / 10;
    const cells = [esc(label), arr.length, Math.round(avg), times[0], times[times.length - 1]];
    if(full){ const variance = times.reduce((a, b) => a + (b - avg) * (b - avg), 0) / times.length; cells.push(Math.round(Math.sqrt(variance)), percentileOf(times, 95)); }
    cells.push((errs ? Math.round(errs / arr.length * 1000) / 10 : 0) + '%', throughput + '/s');
    return '<tr>' + cells.map(c => '<td>' + c + '</td>').join('') + '</tr>';
  }).join('');
  p.innerHTML = head + '<p class="muted small">' + (full ? 'The full Aggregate Report — samples, average, min, max, standard deviation, p95, error rate and throughput per sampler label.' : 'A condensed Summary Report — the same idea as the Aggregate Report with fewer columns.') + '</p>' +
  '<div class="row mt" style="margin-bottom:10px">' + exportBtn + '<span class="muted small">' + results.length + ' sample(s) total</span></div>' +
  (labels.length ? '<div class="table-wrap"><table class="tbl"><thead><tr>' + cols.map(c => '<th>' + c + '</th>').join('') + '</tr></thead><tbody>' + rows + '</tbody></table></div>' : '<p class="muted">No results yet — run the test plan.</p>');
  $('#cfgExportCsv').addEventListener('click', () => exportListenerCsv(node));
}
function paintVrtList(node){
  const results = node.results || [];
  $('#vrtList').innerHTML = results.length ? results.slice().reverse().map((r, ri) => { const i = results.length - 1 - ri; return '<div class="vrt-item' + (VRT_SELECTED[node.id] === i ? ' selected' : '') + '" data-vi="' + i + '">' + (r.error ? '❌' : '✅') + '<span class="t">' + esc(r.label) + '</span><span class="muted">' + r.ms + 'ms</span></div>'; }).join('') : '<p class="muted small" style="padding:10px">No samples yet — run the test plan.</p>';
  $$('.vrt-item', $('#vrtList')).forEach(el => el.addEventListener('click', () => { VRT_SELECTED[node.id] = Number(el.dataset.vi); paintVrtList(node); paintVrtDetail(node, Number(el.dataset.vi)); }));
  const sel = VRT_SELECTED[node.id];
  if(sel !== undefined && results[sel]) paintVrtDetail(node, sel);
  else $('#vrtDetail').innerHTML = '<p class="muted">Select a sample on the left to inspect it.</p>';
}
function paintVrtDetail(node, i){
  const r = node.results[i]; if(!r) return;
  let pretty = r.text || '';
  try{ pretty = JSON.stringify(JSON.parse(r.text || 'null'), null, 2); }catch(e){}
  $('#vrtDetail').innerHTML = '<table class="kv"><tr><td>Sampler</td><td>' + esc(r.label) + '</td></tr><tr><td>Method &amp; URL</td><td style="word-break:break-all">' + esc(r.method) + ' ' + esc(r.url) + '</td></tr><tr><td>Status</td><td>' + (r.status === 0 ? 'Network error' : r.status) + '</td></tr><tr><td>Response time</td><td>' + r.ms + ' ms</td></tr>' +
  (r.assertionDetail !== undefined ? '<tr><td>Assertion</td><td>' + (r.assertionFailed ? '<span class="badge b-err">FAILED</span> ' + esc(r.assertionDetail || '') : '<span class="badge b-ok">PASSED</span>') + '</td></tr>' : '') +
  '</table>' +
  '<h3 class="mt" style="font-size:1rem">Response body</h3><pre class="json">' + syntaxJson(pretty || '(no body)') + '</pre>';
}
function exportListenerCsv(node){
  const results = node.results || [];
  if(!results.length) return toast('No results yet — run the test plan first', 'warn');
  const header = 'sample,timestamp_ms,label,method,status,response_time_ms,success\n';
  const body = results.map((r, i) => [i + 1, Math.round(r.ts), '"' + r.label.replace(/"/g, '""') + '"', r.method, r.status, r.ms, r.error ? 'false' : 'true'].join(',')).join('\n');
  const blob = new Blob([header + body], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'jmeter_results.csv'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  toast('CSV exported', 'ok');
}
function percentileOf(sorted, p){ if(!sorted.length) return 0; const idx = Math.min(sorted.length - 1, Math.max(0, Math.ceil(p / 100 * sorted.length) - 1)); return sorted[idx]; }

/* ---------- scope resolution & request building ---------- */
function jmFindThreadGroupAncestor(root, id){
  function walk(node, ancestorGroup){
    if(node.id === id) return node.type === 'ThreadGroup' ? node : ancestorGroup;
    const nextAncestor = node.type === 'ThreadGroup' ? node : ancestorGroup;
    for(const c of (node.children || [])){ const f = walk(c, nextAncestor); if(f !== undefined) return f; }
    return undefined;
  }
  return walk(root, null) || null;
}
function jmCollectScope(threadGroup){
  const rootConfigs = PERF_TREE.children.filter(c => JM_CONFIG_TYPES.includes(c.type));
  const groupConfigs = threadGroup ? threadGroup.children.filter(c => JM_CONFIG_TYPES.includes(c.type)) : [];
  const defaults = {}; const headers = {}; const vars = {};
  rootConfigs.concat(groupConfigs).forEach(c => {
    if(c.type === 'HTTPRequestDefaults'){ if(c.protocol) defaults.protocol = c.protocol; if(c.server) defaults.server = c.server; if(c.port) defaults.port = c.port; }
    if(c.type === 'HTTPHeaderManager'){ (c.headers || []).filter(h => h.on && h.key).forEach(h => headers[h.key] = h.value); }
    if(c.type === 'UserDefinedVariables'){ (c.vars || []).filter(v => v.on && v.key).forEach(v => vars[v.key] = v.value); }
  });
  return {defaults, headers, vars};
}
function jmSubstitute(str, vars){
  if(!str) return str;
  return String(str).replace(/\$\{([\w.]+)\}/g, (m, k) => (vars && vars[k] !== undefined && vars[k] !== '') ? vars[k] : m);
}
function jmEffectiveRequest(node, defaults, scopeHeaders, vars){
  const protocol = node.protocol || defaults.protocol || 'https';
  const server = jmSubstitute(node.server || defaults.server || 'api.qasandbox.com', vars);
  const port = node.port || defaults.port || '';
  const portPart = port ? ':' + String(port).trim() : '';
  let path = jmSubstitute(node.path || '/', vars);
  if(!path.startsWith('/')) path = '/' + path;
  const headers = Object.assign({}, scopeHeaders);
  const enabledParams = (node.params || []).filter(p => p.on && p.key);
  let url = protocol + '://' + server + portPart + path;
  let body;
  if(['GET', 'DELETE'].includes(node.method)){
    if(enabledParams.length) url += '?' + enabledParams.map(p => encodeURIComponent(jmSubstitute(p.key, vars)) + '=' + encodeURIComponent(jmSubstitute(p.value, vars))).join('&');
  } else if(node.bodyMode === 'raw'){
    body = jmSubstitute(node.body, vars);
    if(body && !headers['Content-Type']) headers['Content-Type'] = 'application/json';
  } else if(enabledParams.length){
    const obj = {}; enabledParams.forEach(p => obj[jmSubstitute(p.key, vars)] = jmSubstitute(p.value, vars));
    body = JSON.stringify(obj);
    if(!headers['Content-Type']) headers['Content-Type'] = 'application/json';
  }
  return {method:node.method, url, headers, body, label:node.name || (node.method + ' ' + path)};
}

/* ---------- execution engine ---------- */
function jmCountOps(g){
  const reqCount = g.children.filter(c => c.type === 'HTTPRequest').length || 1;
  const loops = g.infinite ? (g.specifyLifetime ? 20 : 10) : g.loops;
  return g.users * loops * reqCount;
}
async function runTestPlan(){
  if(PERF_RUN.running) return;
  const groups = PERF_TREE.children.filter(c => c.type === 'ThreadGroup');
  if(!groups.length) return toast('Add at least one Thread Group first (select the Test Plan, then "+ Add")', 'warn');
  const withSamplers = groups.filter(g => g.children.some(c => c.type === 'HTTPRequest'));
  if(!withSamplers.length) return toast('Add an HTTP Request sampler inside a Thread Group first', 'warn');
  const total = groups.reduce((s, g) => s + jmCountOps(g), 0);
  if(total > PERF_MAX_OPS) return toast('This plan could send about ' + total + ' requests — reduce users/loops to stay under ' + PERF_MAX_OPS, 'err');
  PERF_RUN = {running:true, stopFlag:false, startTs:performance.now()};
  jmClearResults(PERF_TREE); savePerfTree();
  $('#jmRun').disabled = true; $('#jmStop').disabled = false; $('#perfProgress').style.width = '0%';
  let done = 0;
  const tick = () => { done++; $('#perfProgress').style.width = Math.min(100, Math.round(done / total * 100)) + '%'; };
  const setupGs = groups.filter(g => g.kind === 'setUp');
  const normalGs = groups.filter(g => g.kind !== 'setUp' && g.kind !== 'tearDown');
  const teardownGs = groups.filter(g => g.kind === 'tearDown');
  $('#perfProgLabel').textContent = 'Running setUp thread group(s)…';
  for(const g of setupGs){ if(PERF_RUN.stopFlag) break; await runThreadGroup(g, tick); }
  if(!PERF_RUN.stopFlag){ $('#perfProgLabel').textContent = 'Running…'; await Promise.all(normalGs.map(g => runThreadGroup(g, tick))); }
  if(!PERF_RUN.stopFlag){ $('#perfProgLabel').textContent = 'Running tearDown thread group(s)…'; for(const g of teardownGs){ if(PERF_RUN.stopFlag) break; await runThreadGroup(g, tick); } }
  PERF_RUN.running = false; $('#jmRun').disabled = false; $('#jmStop').disabled = true;
  $('#perfProgLabel').textContent = PERF_RUN.stopFlag ? 'Stopped by user' : 'Completed — ' + done + ' request(s) sent';
  savePerfTree();
  toast(PERF_RUN.stopFlag ? 'Test plan stopped' : 'Test plan completed', PERF_RUN.stopFlag ? 'warn' : 'ok');
  paintConfigPanel();
}
async function runThreadGroup(g, tick){
  const httpReqs = g.children.filter(c => c.type === 'HTTPRequest');
  if(!httpReqs.length) return;
  const timer = g.children.find(c => c.type === 'UniformRandomTimer');
  const {defaults, headers, vars} = jmCollectScope(g);
  if(g.startupDelay) await sleep(g.startupDelay * 1000);
  const perUserDelayMs = g.users > 1 ? (g.rampup * 1000) / g.users : 0;
  const loopLimit = g.infinite ? (g.specifyLifetime ? Infinity : 10) : g.loops;
  const groupStart = performance.now();
  const threadPromises = Array.from({length:g.users}, async (_, ui) => {
    if(perUserDelayMs) await sleep(Math.round(ui * perUserDelayMs));
    let loop = 0;
    outer: while(loop < loopLimit){
      if(PERF_RUN.stopFlag) return;
      if(g.specifyLifetime && (performance.now() - groupStart) > g.duration * 1000) return;
      for(const reqNode of httpReqs){
        if(PERF_RUN.stopFlag) return;
        if(timer){ const d = Number(timer.delay || 0) + (timer.randomDelay ? rand(0, Number(timer.randomDelay)) : 0); if(d > 0) await sleep(d); }
        const eff = jmEffectiveRequest(reqNode, defaults, headers, vars);
        const t0 = performance.now();
        let res;
        try{ res = await apiHandle(eff.method, eff.url, eff.headers, eff.body); }
        catch(e){ res = {network:e.message, ms:Math.round(performance.now() - t0), text:'', headers:{}}; }
        const status = res.network ? 0 : res.status;
        const sample = {label:eff.label, method:eff.method, url:eff.url, ms:res.ms, status, error: status === 0 || status >= 400, ts: performance.now() - PERF_RUN.startTs, text:res.text || '', headers:res.headers || {}};
        const assertions = g.children.filter(c => c.type === 'ResponseAssertion');
        if(assertions.length){
          const failMsgs = [];
          assertions.forEach(a => {
            const subject = a.field === 'code' ? String(status) : (sample.text || '');
            const pass = a.mode === 'equals' ? subject === (a.pattern || '') : subject.includes(a.pattern || '');
            if(!pass) failMsgs.push((a.name || 'Response Assertion') + ': expected ' + (a.field === 'code' ? 'code' : 'body') + ' ' + (a.mode === 'equals' ? '=' : 'to contain') + ' "' + a.pattern + '"');
          });
          sample.assertionFailed = failMsgs.length > 0;
          sample.assertionDetail = failMsgs.join('; ') || null;
          if(sample.assertionFailed) sample.error = true;
        }
        recordSample(g, sample);
        tick();
        if(sample.error && g.errorAction && g.errorAction !== 'continue'){
          if(g.errorAction === 'stopThread') return;
          if(g.errorAction === 'stopTest' || g.errorAction === 'stopTestNow'){ PERF_RUN.stopFlag = true; return; }
          if(g.errorAction === 'startNextLoop'){ loop++; continue outer; }
        }
      }
      loop++;
    }
  });
  await Promise.all(threadPromises);
}
function recordSample(g, sample){
  const listeners = g.children.filter(c => JM_LISTENER_TYPES.includes(c.type)).concat(PERF_TREE.children.filter(c => JM_LISTENER_TYPES.includes(c.type)));
  listeners.forEach(l => { if(!l.results) l.results = []; l.results.push(sample); });
  if(listeners.some(l => l.id === SELECTED_NODE_ID)) paintConfigPanel();
}

function guideSection(title, items){
  return '<h2 class="mt">' + title + '</h2><ol>' + items.map(i => '<li style="margin-bottom:8px">' + i + '</li>').join('') + '</ol>';
}
