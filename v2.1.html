<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QA Store – E-Commerce &amp; QA Sandbox (Database • API • Performance practice)</title>
<style>
/* =====================================================================
   QA STORE SANDBOX – custom CSS (no frameworks). Purple + white palette.
   ===================================================================== */
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,380;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap');
:root{
  --p:#6d28d9;--p2:#7c3aed;--p3:#a78bfa;--pd:#3b1478;--p-soft:#ede9fe;--p-bg:#faf8ff;--p-mid:#c4b5fd;
  --grad:linear-gradient(135deg,#7c3aed 0%,#9333ea 50%,#c026d3 100%);
  --grad-soft:linear-gradient(135deg,#f5f0ff 0%,#ede9fe 55%,#e0d4ff 100%);
  --ink:#1c1330;--mut:#6b6785;--line:#e7e2f5;--white:#fff;
  --ok:#16a34a;--ok-bg:#dcfce7;--warn:#b45309;--warn-bg:#fef3c7;--err:#dc2626;--err-bg:#fee2e2;--info:#2563eb;--info-bg:#dbeafe;
  --r:16px;--r-sm:10px;
  --sh:0 2px 10px rgba(76,29,149,.06),0 1px 2px rgba(76,29,149,.05);
  --sh2:0 20px 50px -12px rgba(76,29,149,.28),0 8px 20px -8px rgba(76,29,149,.15);
  --sh-glow:0 8px 24px -6px rgba(124,58,237,.45);
  --serif:"Fraunces","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:"Inter","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--sans);color:var(--ink);background:#fff;line-height:1.6;font-size:15.5px;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body.modal-open{overflow:hidden}
img{max-width:100%;display:block}
a{color:var(--p);text-decoration:none;transition:color .15s}
a:hover{color:var(--pd)}
h1,h2,h3,h4{font-family:var(--serif);font-optical-sizing:auto;line-height:1.12;margin:0 0 .5em;color:var(--ink);letter-spacing:-0.01em}
h1{font-size:clamp(2.1rem,4.6vw,3.6rem);font-weight:600;letter-spacing:-0.02em}
h2{font-size:clamp(1.55rem,3vw,2.2rem);font-weight:600}
h3{font-size:1.18rem;font-weight:600}
p{margin:0 0 1em}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--p-mid);outline-offset:2px;border-radius:4px}
.container{width:100%;max-width:1200px;margin:0 auto;padding:0 20px}
.wide .container.tool{max-width:1500px}
.muted{color:var(--mut)}.small{font-size:.85rem}.center{text-align:center}.right{text-align:right}
.hidden{display:none!important}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.grow{flex:1}
.mt{margin-top:16px}.mb{margin-bottom:16px}
.text-grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border-radius:10px;border:1.5px solid var(--line);background:#fff;color:var(--ink);font-weight:600;font-size:.92rem;transition:transform .15s,box-shadow .15s,border-color .15s,background .15s,color .15s;text-decoration:none!important;white-space:nowrap}
.btn:hover{border-color:var(--p3);color:var(--pd);transform:translateY(-1px);box-shadow:var(--sh)}
.btn:active{transform:translateY(0)}
.btn-primary{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 2px 8px -2px rgba(124,58,237,.5)}
.btn-primary:hover{color:#fff;box-shadow:var(--sh-glow);filter:brightness(1.06);transform:translateY(-1.5px)}
.btn-light{background:#fff;color:var(--p);border-color:#fff}
.btn-light:hover{background:var(--p-soft);color:var(--pd);border-color:var(--p-soft)}
.btn-danger{background:var(--err);border-color:var(--err);color:#fff}
.btn-danger:hover{background:#b91c1c;border-color:#b91c1c;color:#fff;box-shadow:0 8px 20px -8px rgba(220,38,38,.5)}
.btn-ghost{background:transparent}
.btn-ok{background:var(--ok);border-color:var(--ok);color:#fff}.btn-ok:hover{background:#15803d;border-color:#15803d;color:#fff}
.btn-sm{padding:6px 12px;font-size:.82rem;border-radius:8px}
.btn-block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
/* ---------- forms ---------- */
.field{margin-bottom:14px}
.field label{display:block;font-weight:600;font-size:.85rem;margin-bottom:5px}
.field label .req{color:var(--err)}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=search],input[type=tel],input[type=url],select,textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:9px;font:inherit;background:#fff;color:var(--ink);transition:border .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--p2);box-shadow:0 0 0 3px rgba(124,58,237,.15)}
textarea{min-height:100px;resize:vertical}
.field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--err);background:#fff7f7}
.err{display:block;color:var(--err);font-size:.78rem;margin-top:4px;min-height:0}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 16px}
.check{display:flex;gap:8px;align-items:flex-start;font-size:.9rem}
.check input{margin-top:4px;accent-color:var(--p)}
.alert{padding:12px 14px;border-radius:10px;font-size:.9rem;margin-bottom:14px}
.alert-info{background:var(--info-bg);color:#1e40af}.alert-warn{background:var(--warn-bg);color:var(--warn)}.alert-err{background:var(--err-bg);color:#991b1b}.alert-ok{background:var(--ok-bg);color:#166534}
/* ---------- badges ---------- */
.badge{display:inline-block;padding:3px 11px;border-radius:99px;font-size:.74rem;font-weight:700;background:var(--p-soft);color:var(--pd);letter-spacing:.01em}
.b-ok{background:var(--ok-bg);color:#166534}.b-warn{background:var(--warn-bg);color:var(--warn)}.b-err{background:var(--err-bg);color:#991b1b}.b-info{background:var(--info-bg);color:#1e40af}.b-gray{background:#eee;color:#555}
/* ---------- tables ---------- */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff}
table.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
.tbl th{background:var(--p-bg);text-align:left;padding:11px 14px;font-size:.8rem;color:var(--pd);border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr:hover td{background:#fcfbff}
.thumb-sm{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--p-soft)}
/* ---------- tabs ---------- */
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);overflow-x:auto;margin-bottom:18px}
.tab{padding:10px 16px;border:0;background:none;font-weight:600;color:var(--mut);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tab:hover{color:var(--p)}.tab.active{color:var(--p);border-bottom-color:var(--p)}
/* ---------- modal + toast ---------- */
.modal-backdrop{position:fixed;inset:0;background:rgba(30,21,53,.55);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:1000;animation:fade .15s}
.modal{background:#fff;border-radius:18px;padding:26px;width:100%;max-width:640px;max-height:92vh;overflow:auto;box-shadow:var(--sh2);animation:pop .18s}
.modal-sm{max-width:420px;text-align:center}
.modal-lg{max-width:900px}
.modal h3{font-size:1.3rem}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.modal-sm .modal-actions{justify-content:center}
.modal-icon{width:56px;height:56px;border-radius:50%;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;font-weight:800}
.modal-icon.danger{background:var(--err-bg);color:var(--err)}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.x-btn{background:none;border:0;font-size:1.5rem;color:var(--mut);line-height:1}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{transform:translateY(12px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.toast-root{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:10px;z-index:2000;max-width:min(380px,calc(100vw - 32px))}
.toast{background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;box-shadow:var(--sh2);font-size:.9rem;border-left:5px solid var(--p-mid);animation:pop .2s}
.toast.ok{border-left-color:#4ade80}.toast.err{border-left-color:#f87171}.toast.warn{border-left-color:#fbbf24}
/* ---------- header ---------- */
.site-header{position:sticky;top:0;background:rgba(255,255,255,.9);backdrop-filter:blur(12px) saturate(1.4);border-bottom:1px solid var(--line);z-index:100}
.header-row{display:flex;align-items:center;gap:18px;padding-top:12px;padding-bottom:12px}
.logo{display:flex;align-items:center;gap:9px;font-family:var(--serif);font-size:1.5rem;font-weight:600;letter-spacing:-.01em;color:var(--ink)!important;text-decoration:none!important}
.logo b{color:var(--p)}
.logo-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--p),#a78bfa);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--sans);font-weight:800}
.main-nav{display:flex;gap:6px;align-items:center}
.main-nav>a,.dd-btn{padding:8px 12px;border-radius:9px;color:var(--ink);font-weight:600;font-size:.92rem;background:none;border:0;text-decoration:none!important}
.main-nav>a:hover,.dd-btn:hover,.main-nav>a.active{background:var(--p-soft);color:var(--p)}
.dropdown{position:relative}
.dd-menu{display:none;position:absolute;top:100%;left:0;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh2);min-width:220px;padding:6px;z-index:50}
.dropdown.dd-right .dd-menu{left:auto;right:0}
.dropdown.open .dd-menu{display:block}
.dd-menu a{display:block;padding:9px 12px;border-radius:8px;color:var(--ink);font-weight:500;text-decoration:none!important}
.dd-menu a:hover{background:var(--p-soft);color:var(--p)}
.mini-cart{width:340px;padding:16px;max-height:70vh;overflow:auto}
.mini-cart h4{margin:0 0 10px;font-family:var(--sans);font-size:.95rem;display:flex;justify-content:space-between}
.mc-item{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.mc-item img{width:48px;height:48px;border-radius:8px;object-fit:cover}
.mc-item .mc-name{font-size:.85rem;font-weight:600;color:var(--ink);display:block}
.mc-item .mc-meta{font-size:.78rem;color:var(--mut)}
.mc-item .mc-del{background:none;border:0;color:var(--mut);font-size:.95rem;padding:2px}
.mc-item .mc-del:hover{color:var(--err)}
.mini-cart .mc-total{display:flex;justify-content:space-between;font-weight:800;padding:10px 0;border-top:2px solid var(--line);margin-top:4px}
.mini-cart .mc-actions{display:flex;gap:8px;margin-top:8px}
.mini-cart .mc-actions .btn{flex:1}
.mc-empty{text-align:center;padding:20px 10px;color:var(--mut)}
.header-search{margin-left:auto;display:flex;position:relative}
.header-search input{width:230px;padding-right:38px;border-radius:99px;background:var(--p-bg)}
.header-search button{position:absolute;right:4px;top:3px;border:0;background:none;font-size:1rem;padding:6px 8px}
.header-icons{display:flex;align-items:center;gap:6px}
.hicon{position:relative;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--p-bg);color:var(--ink);font-size:1.05rem;text-decoration:none!important}
.hicon:hover{background:var(--p-soft)}
.hicon .count{position:absolute;top:-4px;right:-4px;background:var(--p);color:#fff;font-size:.66rem;min-width:18px;height:18px;border-radius:99px;display:flex;align-items:center;justify-content:center;font-weight:700}
.hicon .count:empty,.hicon .count[data-n="0"]{display:none}
#authLinks{display:flex;gap:6px;align-items:center;margin-left:4px}
.burger{display:none;margin-left:auto;background:var(--p-soft);border:0;width:40px;height:40px;border-radius:10px;font-size:1.3rem;color:var(--p)}
/* ---------- footer ---------- */
.site-footer{background:linear-gradient(160deg,#2e1065 0%,#3b1478 55%,#4c1d95 100%);color:#d9ccff;margin-top:60px;padding:48px 0 22px}
.site-footer h4{color:#fff;font-family:var(--sans);font-size:.95rem}
.site-footer a{color:#d9ccff;display:block;padding:3px 0}
.site-footer a:hover{color:#fff}
.foot-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:28px}
.foot-bottom{border-top:1px solid rgba(255,255,255,.15);margin-top:28px;padding-top:16px;font-size:.82rem;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
/* ---------- hero ---------- */
.hero{background:radial-gradient(ellipse 90% 70% at 15% 20%,#efe6ff 0%,transparent 55%),radial-gradient(ellipse 80% 80% at 85% 80%,#e3d4ff 0%,transparent 55%),linear-gradient(135deg,#f7f4ff 0%,#f0e9ff 55%,#e6d9ff 100%);overflow:hidden}
.hero-inner{display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center;padding:56px 20px}
.hero h1{margin-bottom:.35em}
.hero p.lead{font-size:1.1rem;color:#4a4368;max-width:520px}
.hero-img{border-radius:28px;overflow:hidden;box-shadow:var(--sh2);aspect-ratio:5/4;background:linear-gradient(135deg,var(--p3),var(--p));transform:rotate(1.5deg)}
.hero-img img{width:100%;height:100%;object-fit:cover}
.hero-tag{display:inline-flex;align-items:center;gap:6px;background:#fff;color:var(--p);padding:6px 15px;border-radius:99px;font-weight:700;font-size:.82rem;margin-bottom:16px;box-shadow:var(--sh)}
/* ---------- sections ---------- */
.section{padding:48px 0 0}
.section-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px;gap:12px;flex-wrap:wrap}
.section-head h2{margin:0}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px}
.cat-card{position:relative;border-radius:var(--r);overflow:hidden;aspect-ratio:4/3;display:block;box-shadow:var(--sh);background:var(--p-soft)}
.cat-card img{width:100%;height:100%;object-fit:cover;transition:transform .35s}
.cat-card:hover img{transform:scale(1.06)}
.cat-card span{position:absolute;left:0;right:0;bottom:0;padding:34px 14px 12px;background:linear-gradient(transparent,rgba(46,16,101,.85));color:#fff;font-weight:700;text-decoration:none}
.cat-card small{display:block;font-weight:400;opacity:.85}
.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:20px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.product-card{position:relative;overflow:hidden;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s}
.product-card:hover{transform:translateY(-3px);box-shadow:var(--sh2)}
.pc-img{position:relative;display:block;aspect-ratio:1/1;background:var(--p-soft);overflow:hidden}
.pc-img img{width:100%;height:100%;object-fit:cover}
.badge-sale,.badge-out{position:absolute;top:10px;left:10px;background:var(--p);color:#fff;font-weight:700;font-size:.74rem;padding:3px 10px;border-radius:99px}
.badge-out{background:#444;left:auto;right:10px}
.pc-actions{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:6px;z-index:2}
.pc-actions .icon-btn{opacity:0;transform:translateX(8px);transition:.2s}
.product-card:hover .pc-actions .icon-btn,.pc-actions .icon-btn.active{opacity:1;transform:none}
.icon-btn{width:34px;height:34px;border-radius:50%;background:#fff;border:1px solid var(--line);color:var(--mut);font-size:1rem;display:flex;align-items:center;justify-content:center;box-shadow:var(--sh)}
.icon-btn:hover{color:var(--p);border-color:var(--p)}
.icon-btn.active{background:var(--p);color:#fff;border-color:var(--p)}
.pc-body{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.pc-body h3{font-family:var(--sans);font-size:.98rem;margin:0;font-weight:600}
.pc-body h3 a{color:var(--ink)}
.pc-cat{font-size:.78rem;color:var(--mut)}
.pc-price{display:flex;align-items:baseline;gap:8px;margin:2px 0 8px}
.price{font-weight:800;font-size:1.15rem;color:var(--pd)}
.old{color:var(--mut);text-decoration:line-through;font-size:.88rem}
.pc-body .btn{margin-top:auto}
.rating{display:inline-flex;align-items:center;gap:6px}
.stars{font-size:1rem;letter-spacing:1px;background:linear-gradient(90deg,#f59e0b var(--r,0%),#dcd6ee var(--r,0%));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.rating small{color:var(--mut)}
.trust{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.trust-item{display:flex;gap:14px;align-items:center;padding:18px;border-radius:var(--r);background:var(--p-bg);border:1px solid var(--line);transition:transform .2s,box-shadow .2s}
.trust-item:hover{transform:translateY(-2px);box-shadow:var(--sh);border-color:var(--p-mid)}
.trust-item .ic{font-size:1.7rem;width:52px;height:52px;border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:var(--sh)}
.trust-item b{display:block}
.reviews-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.review-card{padding:20px}
.review-card .who{display:flex;align-items:center;gap:10px;margin-top:12px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--p);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.banner{background:var(--grad);color:#fff;border-radius:22px;padding:36px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;box-shadow:var(--sh-glow)}
.banner h2{color:#fff;margin:0 0 4px}
.page-title{padding:30px 0 6px}
.crumbs{font-size:.85rem;color:var(--mut);margin-bottom:8px}
/* ---------- shop ---------- */
.shop-bar{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;padding:16px;margin-bottom:22px}
.shop-bar .field{margin:0;min-width:150px;flex:1}
.chip{display:inline-block;padding:4px 12px;border-radius:99px;background:var(--p-soft);color:var(--pd);font-size:.8rem;font-weight:600;margin:0 6px 6px 0;text-decoration:none!important}
.chip:hover{background:var(--p);color:#fff}
/* ---------- PDP ---------- */
.pdp{display:grid;grid-template-columns:1.05fr 1fr;gap:40px;padding:14px 0}
.gal-main{aspect-ratio:1/1;border-radius:20px;overflow:hidden;background:var(--p-soft);border:1px solid var(--line)}
.gal-main img{width:100%;height:100%;object-fit:cover}
.thumbs{display:flex;gap:10px;margin-top:12px}
.thumb{width:76px;height:76px;border-radius:12px;overflow:hidden;padding:0;border:2px solid var(--line);background:var(--p-soft)}
.thumb.active{border-color:var(--p)}
.thumb img{width:100%;height:100%;object-fit:cover}
.pdp h1{font-size:clamp(1.6rem,3vw,2.3rem)}
.pdp .price{font-size:1.8rem}
.meta-list{list-style:none;padding:0;margin:14px 0;display:grid;gap:6px;font-size:.92rem}
.meta-list b{display:inline-block;min-width:96px}
.qty{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.qty button{width:38px;border:0;background:var(--p-bg);font-size:1.1rem;color:var(--p)}
.qty input{width:54px;text-align:center;border:0;border-radius:0;padding:8px 0}
.qty input:focus{box-shadow:none}
.rev-item{padding:16px 0;border-bottom:1px solid var(--line)}
.star-pick{display:flex;flex-direction:row-reverse;justify-content:flex-end;gap:2px}
.star-pick input{display:none}
.star-pick label{font-size:1.7rem;color:#dcd6ee;cursor:pointer;margin:0}
.star-pick input:checked~label,.star-pick label:hover,.star-pick label:hover~label{color:#f59e0b}
/* ---------- cart / checkout ---------- */
.two-col{display:grid;grid-template-columns:1.6fr 1fr;gap:26px;align-items:start}
.cart-item{display:grid;grid-template-columns:76px 1fr auto auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.cart-item img{width:76px;height:76px;border-radius:12px;object-fit:cover}
.summary{padding:22px;position:sticky;top:84px}
.sum-row{display:flex;justify-content:space-between;padding:6px 0}
.sum-row.total{border-top:2px solid var(--line);margin-top:8px;padding-top:12px;font-weight:800;font-size:1.15rem;color:var(--pd)}
.sum-item{display:flex;gap:10px;align-items:center;padding:6px 0;font-size:.88rem}
.sum-item img{width:44px;height:44px;border-radius:8px;object-fit:cover}
.steps{display:flex;gap:8px;margin:6px 0 22px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:99px;background:var(--p-bg);color:var(--mut);font-weight:600;font-size:.88rem;border:1px solid var(--line)}
.step i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--line);display:flex;align-items:center;justify-content:center;font-size:.75rem}
.step.active{background:var(--p);color:#fff;border-color:var(--p)}.step.active i{background:#fff;color:var(--p)}
.step.done{background:var(--ok-bg);color:#166534;border-color:#bbf7d0}.step.done i{background:var(--ok);color:#fff}
.pay-opt{display:flex;gap:12px;align-items:center;padding:16px;border:2px solid var(--line);border-radius:12px;margin-bottom:12px;cursor:pointer}
.pay-opt.sel{border-color:var(--p);background:var(--p-bg)}
.pay-opt input{accent-color:var(--p);width:18px;height:18px}
.success-box{text-align:center;padding:46px 20px}
.tick{width:84px;height:84px;border-radius:50%;background:var(--ok);color:#fff;font-size:2.6rem;display:flex;align-items:center;justify-content:center;margin:0 auto 18px}
/* ---------- auth ---------- */
.auth-wrap{max-width:460px;margin:38px auto;padding:30px}
.auth-wrap h1{font-size:1.9rem}
.demo-box{background:var(--p-bg);border:1px dashed var(--p-mid);border-radius:10px;padding:10px 12px;font-size:.82rem;margin-top:14px}
/* ---------- account ---------- */
.acc{display:grid;grid-template-columns:250px 1fr;gap:26px;align-items:start;padding:24px 0}
.acc-nav{padding:10px}
.acc-nav a{display:block;padding:11px 14px;border-radius:10px;color:var(--ink);font-weight:600;text-decoration:none!important}
.acc-nav a:hover{background:var(--p-soft)}.acc-nav a.active{background:var(--p);color:#fff}
.acc-nav a.danger{color:var(--err)}.acc-nav a.danger.active{background:var(--err);color:#fff}
.acc-main{padding:24px;min-height:300px}
.cmp-tbl td:first-child,.cmp-tbl th:first-child{background:var(--p-bg);font-weight:700;width:130px}
.cmp-tbl td{min-width:170px;vertical-align:top}
.empty{text-align:center;padding:40px 16px;color:var(--mut)}
.empty .big{font-size:2.6rem}
/* ---------- admin ---------- */
.admin{display:grid;grid-template-columns:230px 1fr;gap:22px;padding:22px 0;align-items:start}
.admin-side{padding:12px;position:sticky;top:84px}
.admin-side h4{padding:6px 12px;color:var(--mut);font-family:var(--sans);font-size:.78rem}
.admin-side button{display:flex;gap:10px;width:100%;text-align:left;padding:11px 14px;border-radius:10px;border:0;background:none;font-weight:600;color:var(--ink);font-size:.92rem}
.admin-side button:hover{background:var(--p-soft)}.admin-side button.active{background:var(--p);color:#fff}
.admin-main{padding:22px;min-width:0}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:22px}
.stat{padding:16px;border-radius:12px;background:var(--p-bg);border:1px solid var(--line);transition:transform .18s,box-shadow .18s}
.stat:hover{transform:translateY(-2px);box-shadow:var(--sh)}
.stat b{display:block;font-size:1.8rem;font-family:var(--serif);font-weight:600;color:var(--pd)}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:14px}
.toolbar input{max-width:280px}
.pager{display:flex;gap:6px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.pager button{min-width:36px;height:36px;border:1.5px solid var(--line);background:#fff;border-radius:8px;font-weight:600}
.pager button.active{background:var(--p);color:#fff;border-color:var(--p)}
.pager button:disabled{opacity:.4}
.kv{width:100%;border-collapse:collapse}
.kv td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top;font-size:.9rem}
.kv td:first-child{font-weight:700;width:34%;color:var(--pd)}
/* ---------- DB tool ---------- */
.tool-page{padding:18px 0}
.tool-title{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.tool-title h1{font-size:1.7rem;margin:0}
.db{display:grid;grid-template-columns:270px 1fr;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;box-shadow:var(--sh);min-height:620px}
.db-side{background:#2b1b4d;color:#e9defc;padding:14px 0}
.db-brand{padding:0 16px 10px;font-weight:800;color:#fff;display:flex;gap:8px;align-items:center}
.db-name{padding:8px 16px;background:rgba(255,255,255,.08);font-weight:700;font-size:.88rem}
.db-side ul{list-style:none;margin:0;padding:6px 0}
.db-tbl{display:flex;align-items:center;gap:6px;padding:7px 16px;font-size:.88rem;cursor:pointer;color:#e9defc}
.db-toggle{background:none;border:1px solid rgba(255,255,255,.3);color:#e9defc;width:16px;height:16px;border-radius:3px;font-size:.72rem;line-height:1;display:inline-flex;align-items:center;justify-content:center;margin-right:2px;flex-shrink:0;padding:0}
.db-toggle:hover{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.5)}
.db-tbl:hover{background:rgba(255,255,255,.1)}
.db-tbl .n{margin-left:auto;font-size:.72rem;background:rgba(255,255,255,.15);padding:1px 8px;border-radius:99px}
.db-tbl .car{background:none;border:0;color:#b9a5e8;padding:0 4px;font-size:.8rem}
.db-cols{padding:2px 16px 8px 40px;font-size:.76rem;color:#b9a5e8;font-family:var(--mono)}
.db-cols div{padding:1px 0;display:flex;gap:6px;justify-content:space-between}
.db-cols em{color:#8f7cc2;font-style:normal}
.db-cols .pk{color:#fbbf24}
.db-main{padding:16px;min-width:0;background:#fbfaff}
.db-crumb{font-size:.82rem;color:var(--mut);margin-bottom:10px}
.db-toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.db-toolbar select{width:auto;max-width:330px}
#sqlEditor,.code-area{width:100%;min-height:170px;font-family:var(--mono);font-size:.9rem;line-height:1.5;background:#1e1535;color:#f3ecff;border:0;border-radius:10px;padding:14px;tab-size:2;resize:vertical}
.sql-res{margin-top:16px}
.sql-info{font-size:.82rem;color:var(--mut);margin-bottom:6px}
.sql-echo{font-family:var(--mono);font-size:.8rem;background:#fff;border:1px solid var(--line);border-left:4px solid var(--p);padding:8px 12px;border-radius:6px;margin-bottom:8px;white-space:pre-wrap;word-break:break-word}
.sql-msg{padding:10px 14px;border-radius:8px;font-family:var(--mono);font-size:.86rem;margin-bottom:8px;white-space:pre-wrap;word-break:break-word}
.sql-msg.ok{background:var(--ok-bg);color:#166534;border:1px solid #bbf7d0}
.sql-msg.err{background:var(--err-bg);color:#991b1b;border:1px solid #fecaca}
.grid-scroll{max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
table.grid{border-collapse:collapse;width:100%;font-size:.84rem;font-family:var(--sans)}
.grid th{position:sticky;top:0;background:#efe9ff;color:var(--pd);text-align:left;padding:8px 12px;border-bottom:2px solid var(--p-mid);white-space:nowrap;z-index:1}
.grid td{padding:7px 12px;border-bottom:1px solid #f0ecfa;white-space:nowrap;max-width:320px;overflow:hidden;text-overflow:ellipsis}
.grid tr:nth-child(even) td{background:#faf8ff}
.grid td.num{text-align:right;font-variant-numeric:tabular-nums}
.grid .null{color:#a79fc0;font-style:italic}
.hist{margin-top:18px}
.hist-item{font-family:var(--mono);font-size:.78rem;padding:6px 10px;border-radius:6px;background:#fff;border:1px solid var(--line);margin-bottom:5px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist-item:hover{border-color:var(--p);background:var(--p-bg)}
/* ---------- Postman tool ---------- */
.pm{display:grid;grid-template-columns:290px 1fr;border:1px solid #d8d8e0;border-radius:14px;overflow:hidden;background:#fff;min-height:700px;box-shadow:var(--sh)}
.pm-side{background:#f7f7fa;border-right:1px solid #e3e3ea;display:flex;flex-direction:column;min-width:0}
.pm-side-tabs{display:flex;border-bottom:1px solid #e3e3ea}
.pm-side-tabs button{flex:1;padding:11px 4px;border:0;background:none;font-weight:600;font-size:.82rem;color:var(--mut);border-bottom:2px solid transparent}
.pm-side-tabs button.active{color:var(--ink);border-bottom-color:#ff6c37}
.pm-side-body{padding:8px;overflow:auto;flex:1;max-height:760px}
.pm-folder>.f-head{display:flex;gap:6px;align-items:center;padding:7px 8px;font-weight:700;font-size:.85rem;cursor:pointer;border-radius:6px}
.pm-folder>.f-head:hover{background:#ececf3}
.pm-folder .f-head .run{margin-left:auto;font-size:.7rem;border:1px solid #ccc;background:#fff;border-radius:5px;padding:1px 6px;color:#555}
.pm-req{display:flex;gap:8px;align-items:center;padding:6px 8px 6px 24px;font-size:.82rem;cursor:pointer;border-radius:6px}
.pm-req:hover{background:#ececf3}
.mth{font-family:var(--mono);font-weight:800;font-size:.68rem;min-width:44px}
.m-GET{color:#0a9a55}.m-POST{color:#e8781a}.m-PUT{color:#2f6fe4}.m-PATCH{color:#8b4fd8}.m-DELETE{color:#dc2f2f}
.pm-main{display:flex;flex-direction:column;min-width:0}
.pm-tabbar{display:flex;background:#f0f0f5;border-bottom:1px solid #e0e0e8;overflow-x:auto}
.pm-tab{display:flex;gap:8px;align-items:center;padding:9px 12px;font-size:.8rem;border-right:1px solid #e0e0e8;cursor:pointer;white-space:nowrap;background:#f0f0f5;max-width:220px}
.pm-tab.active{background:#fff;border-top:2px solid #ff6c37}
.pm-tab .t-name{overflow:hidden;text-overflow:ellipsis}
.pm-tab .cl{border:0;background:none;color:#888;font-size:1rem;line-height:1;padding:0 2px}
.pm-tab-add{padding:9px 14px;border:0;background:none;font-size:1.1rem;color:#555}
.pm-envbar{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid #eee;flex-wrap:wrap;font-size:.82rem}
.pm-envbar select{width:auto;padding:5px 8px;font-size:.82rem}
.pm-name-input{border:1px solid transparent;font-weight:700;padding:4px 8px;width:auto;min-width:200px;background:transparent}
.pm-name-input:hover,.pm-name-input:focus{border-color:#ddd;background:#fff}
.pm-urlbar{display:flex;gap:0;padding:12px;align-items:stretch;flex-wrap:wrap;row-gap:8px}
.pm-urlbar select{width:118px;border-radius:8px 0 0 8px;font-weight:800;background:#f7f7fa;border-right:0}
.pm-urlbar input{flex:1;min-width:180px;border-radius:0;font-family:var(--mono);font-size:.88rem}
.pm-send{border:0;background:#ff6c37;color:#fff;font-weight:700;padding:0 26px;border-radius:0 8px 8px 0;font-size:.95rem}
.pm-send:hover{background:#e85a26}
.pm-send:disabled{opacity:.6}
.pm-save{margin-left:8px;border:1.5px solid #d0d0da;background:#fff;border-radius:8px;padding:0 16px;font-weight:600}
.pm-rtabs{display:flex;gap:2px;border-bottom:1px solid #e3e3ea;padding:0 12px;overflow-x:auto}
.pm-rtabs button{border:0;background:none;padding:10px 12px;font-size:.84rem;color:#555;border-bottom:2px solid transparent;white-space:nowrap}
.pm-rtabs button.active{color:#111;font-weight:700;border-bottom-color:#ff6c37}
.pm-rtabs .dot{color:#0a9a55}
.pm-panel{padding:12px;min-height:200px}
.kvt{width:100%;border-collapse:collapse;font-size:.83rem}
.kvt th{text-align:left;padding:6px;border:1px solid #e3e3ea;background:#f7f7fa;font-weight:600;color:#555}
.kvt td{border:1px solid #e3e3ea;padding:0}
.kvt input[type=text]{border:0;border-radius:0;padding:8px;font-family:var(--mono);font-size:.82rem;box-shadow:none}
.kvt td.ck{width:34px;text-align:center}.kvt td.dl{width:34px;text-align:center}
.kvt .dl button{border:0;background:none;color:#999}
.kvt tr.auto td{background:#fafafa;color:#888}
.kvt tr.auto input{color:#888;background:#fafafa}
.pm-split{border-top:6px solid #f0f0f5}
.pm-res-bar{display:flex;gap:16px;align-items:center;justify-content:flex-end;padding:8px 14px;font-size:.82rem;color:#555;flex-wrap:wrap}
.pm-res-bar b{font-weight:700}
.st{padding:2px 9px;border-radius:5px;font-weight:700;font-size:.8rem}
.st-2{color:#0a7d44;background:#d8f5e6}.st-3{color:#1d5fd0;background:#dce9ff}.st-4{color:#b45309;background:#ffedd5}.st-5{color:#b91c1c;background:#fde0e0}.st-0{color:#555;background:#eee}
pre.json{margin:0;font-family:var(--mono);font-size:.82rem;line-height:1.55;white-space:pre-wrap;word-break:break-word;background:#fafafc;border:1px solid #eee;border-radius:8px;padding:14px;max-height:520px;overflow:auto}
.j-k{color:#7c3aed}.j-s{color:#0a7d44}.j-n{color:#d9480f}.j-b{color:#1d5fd0}.j-z{color:#999}
.tr-row{display:flex;gap:10px;align-items:flex-start;padding:8px 4px;border-bottom:1px solid #eee;font-size:.86rem}
.tr-row small{display:block;color:#b91c1c;font-family:var(--mono)}
.pass{background:#d8f5e6;color:#0a7d44;padding:1px 8px;border-radius:4px;font-weight:700;font-size:.72rem}
.fail{background:#fde0e0;color:#b91c1c;padding:1px 8px;border-radius:4px;font-weight:700;font-size:.72rem}
.pm-empty{text-align:center;padding:50px 10px;color:#888}
.pm-empty .big{font-size:3rem}
.pm-err{background:#fde8e8;color:#8f1d1d;padding:14px;border-radius:8px;font-family:var(--mono);font-size:.85rem}
.pm-mode{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:10px;font-size:.85rem;align-items:center}
.pm-mode label{display:flex;gap:5px;align-items:center;cursor:pointer}
.pm-mode select{width:auto;padding:4px 8px;font-size:.82rem}
.pm-hint{font-size:.78rem;color:#777;margin-top:8px}
.pm-hist-item{padding:8px;border-radius:6px;cursor:pointer;font-size:.78rem;display:flex;gap:6px;align-items:center}
.pm-hist-item:hover{background:#ececf3}
.pm-hist-item .u{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.pm-side .tg{display:inline-block;width:16px;text-align:center;font-weight:800;color:#6d28d9}
.pm-folder .f-head .run{margin-left:4px}.pm-folder .f-head .run:first-of-type{margin-left:auto}
.pm-bottom{border-top:1px solid #e3e3ea;background:#fff;margin-top:12px;border:1px solid #d8d8e0;border-radius:14px;overflow:hidden}
.pm-log{font-family:var(--mono);font-size:.78rem;max-height:200px;min-height:90px;overflow:auto;padding:8px 12px;background:#1e1b2e;color:#e9e4ff}
.lg span{color:#8a84a8;margin-right:6px}.lg-error{color:#fca5a5}.lg-ok{color:#86efac}.lg-warn{color:#fcd34d}.lg-req{color:#93c5fd}
#termIn{border:0;border-top:1px solid #333;border-radius:0;background:#12101c;color:#e9e4ff;font-family:var(--mono);font-size:.82rem}
/* ---- API client polish: SVG icons, hover actions, runner ---- */
.ic{stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px;flex:none}
.ic.fill{fill:currentColor;stroke:none}
.pm .btn,.rn .btn,.pm-save{display:inline-flex;align-items:center;justify-content:center;gap:6px}
.pm .btn-block{display:flex;width:100%}
.tgl{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border:1px solid #c4c4d2;border-radius:4px;color:#555;background:#fff;flex:none}
.fi{display:inline-flex;color:#7c7c92;flex:none}.fi.col{color:#4f46e5}
.f-head .nm,.pm-req .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cnt{font-size:.7rem;color:#8a8aa0;font-weight:600;padding:0 4px}
.acts{display:none;gap:1px;flex:none}
.f-head:hover .acts,.pm-req:hover .acts,.f-head:focus-within .acts,.pm-req:focus-within .acts{display:inline-flex}
.f-head:hover .cnt{display:none}
@media (hover:none){.acts{display:inline-flex}.f-head .cnt{display:none}}
.ib{border:0;background:none;width:24px;height:24px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;color:#6b6b80;cursor:pointer;padding:0}
.ib:hover{background:#dcdce8;color:#111}.ib.danger:hover{background:#fde8e8;color:#b91c1c}
.pm-empty .big{display:flex;justify-content:center;color:#b5b5c6;margin-bottom:8px}
.rn{padding:14px;display:flex;flex-direction:column;gap:12px}
.rn-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.rn-title{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.rn-title .sub{font-size:.68rem;text-transform:uppercase;letter-spacing:.07em;color:#8a8aa0;font-weight:700}
.rn-title b{font-size:1.05rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rn-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.rn-cfg{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;padding:12px;border:1px solid #e3e3ea;border-radius:10px;background:#fafafd}
.rn-cfg label{display:flex;flex-direction:column;gap:4px;font-size:.74rem;font-weight:600;color:#555}
.rn-cfg input[type=number]{width:96px;padding:6px 8px;border:1px solid #d0d0da;border-radius:6px;font:inherit}
.rn-cfg label.chk{flex-direction:row;align-items:center;gap:6px;font-weight:500;padding-bottom:6px;font-size:.82rem}
.rn-data{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rn-file{display:flex;align-items:center;gap:8px;padding:4px 6px 4px 10px;border:1px solid #cfe3d6;background:#f0faf4;border-radius:8px;font-size:.82rem;color:#166534}
.rn-prev{overflow:auto;border:1px solid #e3e3ea;border-radius:8px;max-height:170px}
.rn-prev table{border-collapse:collapse;width:100%;font-size:.78rem}
.rn-prev th,.rn-prev td{padding:5px 10px;border-bottom:1px solid #eee;text-align:left;white-space:nowrap}
.rn-prev th{background:#f5f5fa;position:sticky;top:0;font-family:var(--mono);font-weight:600}
.rn-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.rc{border:1px solid #e3e3ea;border-radius:10px;padding:8px 12px;background:#fff}
.rc span{display:block;font-size:.66rem;color:#8a8aa0;text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.rc b{font-size:1.15rem}.rc.ok b{color:#15803d}.rc.bad b{color:#b91c1c}
.rn-bar{height:5px;background:#ececf3;border-radius:3px;overflow:hidden}
.rn-bar i{display:block;height:100%;background:#4f46e5;transition:width .2s}
.rn-body{display:grid;grid-template-columns:minmax(270px,38%) 1fr;gap:12px;min-height:340px}
.rn-list{border:1px solid #e3e3ea;border-radius:10px;overflow:auto;max-height:600px;background:#fff}
.rn-filter{display:flex;gap:4px;padding:8px;border-bottom:1px solid #eee;position:sticky;top:0;background:#fff;z-index:1}
.rn-filter button{border:1px solid #d8d8e2;background:#fff;border-radius:999px;padding:3px 11px;font-size:.76rem;font-weight:600;color:#555;cursor:pointer}
.rn-filter button.active{background:#1f2937;color:#fff;border-color:#1f2937}
.rn-iter{padding:6px 10px;background:#f5f5fa;font-size:.72rem;font-weight:700;color:#555;border-bottom:1px solid #eee;display:flex;gap:8px;justify-content:space-between}
.rn-iter span{font-weight:500;color:#888;font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rn-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid #f0f0f5;cursor:pointer;font-size:.82rem}
.rn-item:hover{background:#f7f7fb}.rn-item.sel{background:#eef2ff;box-shadow:inset 3px 0 0 #4f46e5}.rn-item.plan{cursor:default;color:#666}
.st-ic{flex:none;width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff}
.st-ic.ok{background:#16a34a}.st-ic.bad{background:#dc2626}.st-ic.wait{background:#d4d4dd}.st-ic.run{background:#4f46e5}
.rn-item .meta{font-size:.72rem;color:#777;white-space:nowrap;text-align:right}
.rn-detail{border:1px solid #e3e3ea;border-radius:10px;background:#fff;min-width:0;display:flex;flex-direction:column}
.rd-head{padding:12px 14px;border-bottom:1px solid #eee}
.rd-url{font-family:var(--mono);font-size:.78rem;color:#555;word-break:break-all;margin-top:4px}
.rd-body{padding:12px;overflow:auto;max-height:480px}
.rd-body table{border-collapse:collapse;width:100%;font-size:.8rem}
.rd-body td,.rd-body th{padding:6px 8px;border:1px solid #e3e3ea;text-align:left;vertical-align:top}

  if(img.dataset.fb) return;

/* ---------- referential integrity (shared by SQL engine, Admin UI & REST API) ---------- */
function fkError(fk, tn, kind){
  if(kind === 'delete') return sqlErr(1451, '23000', 'Cannot delete or update a parent row: a foreign key constraint fails (`qa_ecommerce`.`' + fk.t + '`, CONSTRAINT `fk_' + fk.t + '_' + fk.c + '` FOREIGN KEY (`' + fk.c + '`) REFERENCES `' + tn + '` (`id`))');
  return sqlErr(1452, '23000', 'Cannot add or update a child row: a foreign key constraint fails (`qa_ecommerce`.`' + fk.t + '`, CONSTRAINT `fk_' + fk.t + '_' + fk.c + '` FOREIGN KEY (`' + fk.c + '`) REFERENCES `' + fk.rt + '` (`id`))');
}
function deleteRows(tn, rows){
  if(!rows.length) return 0;
  const ids = new Set(rows.map(r => r.id));
  FKS.forEach(fk => {
    if(fk.rt !== tn || fk.on !== 'RESTRICT') return;
    if(DB[fk.t].some(ch => ids.has(ch[fk.c]))) throw fkError(fk, tn, 'delete');
  });
  FKS.forEach(fk => {
    if(fk.rt !== tn) return;
    if(fk.on === 'CASCADE'){
      const kids = DB[fk.t].filter(ch => ids.has(ch[fk.c]));
      if(kids.length) deleteRows(fk.t, kids);
    } else if(fk.on === 'SET NULL'){
      DB[fk.t].forEach(ch => { if(ids.has(ch[fk.c])) ch[fk.c] = null; });
    }
  });
  DB[tn] = DB[tn].filter(r => !ids.has(r.id));
  return rows.length;
}

function calcTotals(lines, coupon, payment){
  const sub = r2(lines.reduce((s, l) => s + l.price * l.qty, 0));
  let discount = 0;
  if(coupon === 'SAVE10') discount = r2(sub * 0.10);
  else if(coupon === 'WELCOME5') discount = Math.min(5, sub);
  const after = Math.max(0, sub - discount);
  const shipping = (after === 0 || after >= 100) ? 0 : 7.99;
  const tax = r2(after * 0.08);
  const cod = payment === 'cod' ? 1.99 : 0;
  const total = r2(after + shipping + tax + cod);
  return {sub, discount, shipping, tax, cod, total};
}

/* ---------- order creation (used by checkout UI and the REST API) ---------- */
function createOrder({customerId, items, address, payment, coupon}){
  if(!Array.isArray(items) || !items.length) throw {status:422, message:'Order must contain at least one item'};
  if(!['card', 'cod'].includes(payment)) throw {status:422, message:"payment_method must be 'card' or 'cod'"};
  if(!address || String(address).trim().length < 10) throw {status:422, message:'shipping_address is required (min 10 characters)'};
  const lines = [];
  for(const it of items){
    const qty = Number(it.quantity != null ? it.quantity : it.qty);
    const p = byId('products', it.product_id);
    if(!p || p.status !== 'active') throw {status:404, message:'Product ' + it.product_id + ' not found'};
    if(!Number.isInteger(qty) || qty < 1 || qty > 99) throw {status:422, message:'Invalid quantity for product ' + p.id + ' (1-99)'};
    if(p.stock < qty) throw {status:409, message:'Insufficient stock for "' + p.name + '". Available: ' + p.stock};
    lines.push({product:p, qty, price:p.price});
  }
  const tot = calcTotals(lines, coupon, payment);
  const order = {id:nextId('orders'), customer_id:customerId, total:tot.total, payment_method:payment, status: payment === 'card' ? 'Paid' : 'Pending', shipping_address:String(address).trim(), created_at:nowStr()};
  DB.orders.push(order);
  lines.forEach(l => {
    DB.order_items.push({id:nextId('order_items'), order_id:order.id, product_id:l.product.id, quantity:l.qty, price:l.price});
    l.product.stock -= l.qty;
  });
  saveDB();
  return {order, lines, totals:tot};
}

   SQL ENGINE – a small MySQL-flavoured engine that runs on the sandbox DB
   Supports: SELECT (JOIN, WHERE, GROUP BY, HAVING, ORDER BY, LIMIT, DISTINCT,

   ===================================================================== */
const SQL_DB = 'qa_ecommerce';
const RESERVED = new Set(['SELECT','FROM','WHERE','GROUP','ORDER','BY','LIMIT','OFFSET','JOIN','INNER','LEFT','RIGHT','OUTER','CROSS','ON','HAVING','UNION','SET','VALUES','AND','OR','NOT','AS','INTO','INSERT','UPDATE','DELETE','IN','IS','LIKE','BETWEEN','NULL','ASC','DESC','DISTINCT','TRUE','FALSE']);
const AGG = new Set(['COUNT','SUM','AVG','MIN','MAX']);

function syntaxErr(src, pos){
  return sqlErr(1064, '42000', "You have an error in your SQL syntax; check the manual that corresponds to your MySQL server version for the right syntax to use near '" + src.slice(pos, pos + 40) + "' at line 1");
}

function tokenize(src){
  const toks = []; let i = 0; const n = src.length;
  while(i < n){
    const c = src[i];
    if(/\s/.test(c)){ i++; continue; }
    if(c === '-' && src[i+1] === '-' && (i + 2 >= n || /\s/.test(src[i+2]))){ while(i < n && src[i] !== '\n') i++; continue; }
    if(c === '#'){ while(i < n && src[i] !== '\n') i++; continue; }
    if(c === '/' && src[i+1] === '*'){ const e = src.indexOf('*/', i + 2); i = e < 0 ? n : e + 2; continue; }
    const s = i;
    if(c === "'" || c === '"'){
      const q = c; let v = ''; i++; let closed = false;
      while(i < n){
        if(src[i] === '\\' && i + 1 < n){ const nx = src[i+1]; v += nx === 'n' ? '\n' : nx === 't' ? '\t' : nx; i += 2; continue; }
        if(src[i] === q){ if(src[i+1] === q){ v += q; i += 2; continue; } closed = true; i++; break; }
        v += src[i++];
      }
      if(!closed) throw syntaxErr(src, s);
      toks.push({t:'str', v, s, e:i}); continue;
    }
    if(c === '`'){
      const e = src.indexOf('`', i + 1);
      if(e < 0) throw syntaxErr(src, s);
      toks.push({t:'id', v:src.slice(i + 1, e), s, e:e + 1, q:true}); i = e + 1; continue;
    }
    if(/[0-9]/.test(c) || (c === '.' && /[0-9]/.test(src[i+1] || ''))){
      const m = /^(\d+\.?\d*|\.\d+)/.exec(src.slice(i));
      toks.push({t:'num', v:parseFloat(m[0]), s, e:i + m[0].length}); i += m[0].length; continue;
    }
    if(/[A-Za-z_]/.test(c)){
      const m = /^[A-Za-z_][A-Za-z0-9_$]*/.exec(src.slice(i));
      toks.push({t:'id', v:m[0], s, e:i + m[0].length}); i += m[0].length; continue;
    }
    const two = src.substr(i, 2);
    if(['<=', '>=', '<>', '!='].includes(two)){ toks.push({t:'op', v:two, s, e:i + 2}); i += 2; continue; }
    if('=<>+-*/%(),.;'.includes(c)){ toks.push({t:'op', v:c, s, e:i + 1}); i++; continue; }
    throw syntaxErr(src, s);
  }
  return toks;
}

function splitSQL(sql){
  const out = []; let cur = ''; let q = null;
  for(let i = 0; i < sql.length; i++){
    const c = sql[i];
    if(q){
      cur += c;
      if(c === '\\'){ cur += sql[++i] || ''; continue; }
      if(c === q){ if(sql[i+1] === q){ cur += sql[++i]; } else q = null; }
      continue;
    }
    if(c === "'" || c === '"' || c === '`'){ q = c; cur += c; continue; }
    if(c === ';'){ if(cur.trim()) out.push(cur.trim()); cur = ''; continue; }
    cur += c;
  }
  if(cur.trim()) out.push(cur.trim());
  return out.filter(s => s.replace(/--.*$/gm, '').trim().length);
}

class SqlParser {
  constructor(src){ this.src = src; this.toks = tokenize(src); this.p = 0; }
  peek(o = 0){ return this.toks[this.p + o]; }
  next(){ return this.toks[this.p++]; }
  err(){ const t = this.toks[this.p]; return syntaxErr(this.src, t ? t.s : this.src.length); }
  isKw(w, o = 0){ const t = this.peek(o); return !!t && t.t === 'id' && !t.q && t.v.toUpperCase() === w; }
  acceptKw(w){ if(this.isKw(w)){ this.p++; return true; } return false; }
  expectKw(w){ if(!this.acceptKw(w)) throw this.err(); }
  isOp(v, o = 0){ const t = this.peek(o); return !!t && t.t === 'op' && t.v === v; }
  acceptOp(v){ if(this.isOp(v)){ this.p++; return true; } return false; }
  expectOp(v){ if(!this.acceptOp(v)) throw this.err(); }
  ident(){ const t = this.peek(); if(!t || t.t !== 'id') throw this.err(); this.p++; return t.v; }
  intLit(){ const t = this.peek(); if(!t || t.t !== 'num') throw this.err(); this.p++; return Math.floor(t.v); }

  parseStatement(){
    const t = this.peek();
    if(!t || t.t !== 'id') throw this.err();
    const w = t.v.toUpperCase(); let st;
    switch(w){
      case 'SELECT': st = this.parseSelect(); break;
      case 'INSERT': st = this.parseInsert(); break;
      case 'UPDATE': st = this.parseUpdate(); break;
      case 'DELETE': st = this.parseDelete(); break;
      case 'SHOW': st = this.parseShow(); break;
      case 'DESCRIBE': case 'DESC': this.p++; st = {type:'describe', table:this.ident()}; break;
      case 'USE': this.p++; st = {type:'use', db:this.ident()}; break;
      case 'EXPLAIN': this.p++; st = {type:'explain', q:this.parseSelect()}; break;
      case 'START': this.p++; this.expectKw('TRANSACTION'); st = {type:'begin'}; break;
      case 'BEGIN': this.p++; st = {type:'begin'}; break;
      case 'COMMIT': this.p++; st = {type:'commit'}; break;
      case 'ROLLBACK': this.p++; st = {type:'rollback'}; break;
      case 'CREATE': case 'DROP': case 'ALTER': case 'TRUNCATE': case 'GRANT': case 'REVOKE': case 'RENAME':
        st = {type:'denied', cmd:w}; this.p = this.toks.length; break;
      default: throw this.err();
    }
    if(this.p < this.toks.length) throw this.err();
    return st;
  }
  parseShow(){
    this.expectKw('SHOW');
    if(this.acceptKw('TABLES')) return {type:'showTables'};
    if(this.acceptKw('DATABASES')) return {type:'showDatabases'};
    if(this.acceptKw('COLUMNS') || this.acceptKw('FIELDS')){ if(!this.acceptKw('FROM')) this.expectKw('IN'); return {type:'describe', table:this.ident()}; }
    throw this.err();
  }
  parseTableRef(){
    const table = this.ident(); let alias = table;
    if(this.acceptKw('AS')) alias = this.ident();
    else { const t = this.peek(); if(t && t.t === 'id' && (t.q || !RESERVED.has(t.v.toUpperCase()))){ alias = t.v; this.p++; } }
    return {table, alias};
  }
  parseSelectItem(){
    if(this.isOp('*')){ this.p++; return {star:true, table:null}; }
    if(this.peek() && this.peek().t === 'id' && this.isOp('.', 1) && this.isOp('*', 2)){ const tb = this.peek().v; this.p += 3; return {star:true, table:tb}; }
    const st = this.p; const e = this.parseExpr();
    let label = e.type === 'col' ? e.name : this.src.slice(this.toks[st].s, this.toks[this.p - 1].e);
    let alias = null;
    if(this.acceptKw('AS')){ const t = this.next(); if(!t || (t.t !== 'id' && t.t !== 'str')) throw this.err(); alias = t.v; }
    else { const t = this.peek(); if(t && t.t === 'id' && (t.q || !RESERVED.has(t.v.toUpperCase()))){ alias = t.v; this.p++; } }
    if(alias) label = alias;
    return {e, label, alias};
  }
  parseSelect(){
    this.expectKw('SELECT');
    const q = {type:'select', distinct:false, items:[], from:null, joins:[], where:null, group:[], having:null, order:[], limit:null, offset:0};
    if(this.acceptKw('DISTINCT')) q.distinct = true;
    do { q.items.push(this.parseSelectItem()); } while(this.acceptOp(','));
    if(this.acceptKw('FROM')){
      q.from = this.parseTableRef();
      for(;;){
        if(this.acceptOp(',')){ q.joins.push({kind:'CROSS', ref:this.parseTableRef(), on:null}); continue; }
        let kind = null;
        if(this.isKw('JOIN')){ this.p++; kind = 'INNER'; }
        else if(this.isKw('INNER') && this.isKw('JOIN', 1)){ this.p += 2; kind = 'INNER'; }
        else if(this.isKw('LEFT')){ this.p++; this.acceptKw('OUTER'); this.expectKw('JOIN'); kind = 'LEFT'; }
        else if(this.isKw('CROSS') && this.isKw('JOIN', 1)){ this.p += 2; kind = 'CROSS'; }
        else break;
        const ref = this.parseTableRef(); let on = null;
        if(kind !== 'CROSS'){ this.expectKw('ON'); on = this.parseExpr(); }
        q.joins.push({kind, ref, on});
      }
    }
    if(this.acceptKw('WHERE')) q.where = this.parseExpr();
    if(this.isKw('GROUP')){ this.p++; this.expectKw('BY'); do { q.group.push(this.parseExpr()); } while(this.acceptOp(',')); }
    if(this.acceptKw('HAVING')) q.having = this.parseExpr();
    if(this.isKw('ORDER')){
      this.p++; this.expectKw('BY');
      do { const e = this.parseExpr(); let dir = 1; if(this.acceptKw('DESC')) dir = -1; else this.acceptKw('ASC'); q.order.push({e, dir}); } while(this.acceptOp(','));
    }
    if(this.acceptKw('LIMIT')){
      const a = this.intLit();
      if(this.acceptOp(',')){ q.offset = a; q.limit = this.intLit(); }
      else { q.limit = a; if(this.acceptKw('OFFSET')) q.offset = this.intLit(); }
    }
    if(this.isKw('UNION')){
      this.p++; let all = false; if(this.acceptKw('ALL')) all = true; else this.acceptKw('DISTINCT');
      const right = this.parseSelect();
      return {type:'union', all, left:q, right};
    }
    return q;
  }
  parseInsert(){
    this.expectKw('INSERT'); this.acceptKw('INTO');
    const table = this.ident(); let cols = null;
    if(this.isOp('(')){ this.p++; cols = []; do { cols.push(this.ident()); } while(this.acceptOp(',')); this.expectOp(')'); }
    if(!this.acceptKw('VALUES') && !this.acceptKw('VALUE')) throw this.err();
    const rows = [];
    do { this.expectOp('('); const r = []; do { r.push(this.parseExpr()); } while(this.acceptOp(',')); this.expectOp(')'); rows.push(r); } while(this.acceptOp(','));
    return {type:'insert', table, cols, rows};
  }
  parseUpdate(){
    this.expectKw('UPDATE'); const table = this.ident(); this.expectKw('SET');
    const sets = [];
    do { const c = this.ident(); this.expectOp('='); sets.push({c, e:this.parseExpr()}); } while(this.acceptOp(','));
    let where = null, limit = null;
    if(this.acceptKw('WHERE')) where = this.parseExpr();
    if(this.acceptKw('LIMIT')) limit = this.intLit();
    return {type:'update', table, sets, where, limit};
  }
  parseDelete(){
    this.expectKw('DELETE'); this.expectKw('FROM'); const table = this.ident();
    let where = null, limit = null;
    if(this.acceptKw('WHERE')) where = this.parseExpr();
    if(this.acceptKw('LIMIT')) limit = this.intLit();
    return {type:'delete', table, where, limit};
  }

  let rows = DB[tn].filter(r => !where || truthy(ev(where, {[tn]: r}, ctx)));
  if(limit !== null) rows = rows.slice(0, limit);
  return rows;
}
function runUpdate(st){
  const tn = resolveTable(st.table); const sch = SCHEMA[tn]; const src = rowSource(tn);
  st.sets.forEach(s => { if(!sch.find(c => c.n === s.c.toLowerCase())) throw sqlErr(1054, '42S22', "Unknown column '" + s.c + "' in 'field list'"); });
  const rows = matchRows(tn, st.where, st.limit); const staged = []; let changed = 0; const matched = new Set(rows);
  rows.forEach((r, i) => {
    const nr = Object.assign({}, r);
    st.sets.forEach(s => {
      const col = sch.find(c => c.n === s.c.toLowerCase());
      let v = ev(s.e, {[tn]: r}, {sources:src, clause:'field list'});
      if((v === null || v === undefined) && col.nn) throw sqlErr(1048, '23000', "Column '" + col.n + "' cannot be null");
      nr[col.n] = coerceVal(tn, col, v, i + 1);

    validateRow(tn, nr, DB[tn].filter(x => !matched.has(x)).concat(staged), null, i + 1);
    if(JSON.stringify(nr) !== JSON.stringify(r)) changed++;
    staged.push(nr);
  });
  rows.forEach((r, i) => Object.assign(r, staged[i]));
  if(changed) saveDB();
  return {type:'ok', msg:'Query OK, ' + changed + ' row' + (changed === 1 ? '' : 's') + ' affected (0.00 sec)\nRows matched: ' + rows.length + '  Changed: ' + changed + '  Warnings: 0'};
}
function runDelete(st){
  const tn = resolveTable(st.table);
  const rows = matchRows(tn, st.where, st.limit);
  const n = deleteRows(tn, rows);
  if(n) saveDB();
  return {type:'ok', msg:'Query OK, ' + n + ' row' + (n === 1 ? '' : 's') + ' affected (0.00 sec)'};
}
function runStmt(st){
  switch(st.type){
    case 'select': case 'union': return runSelect(st);
    case 'insert': return runInsert(st);
    case 'update': return runUpdate(st);
    case 'delete': return runDelete(st);
    case 'showTables': return {type:'rows', cols:['Tables_in_' + SQL_DB], rows:TABLE_NAMES.map(n => [n])};
    case 'showDatabases': return {type:'rows', cols:['Database'], rows:[['information_schema'], [SQL_DB]]};
    case 'describe': {
      const tn = resolveTable(st.table);
      return {type:'rows', cols:['Field', 'Type', 'Null', 'Key', 'Default', 'Extra'], rows:SCHEMA[tn].map(c => [c.n, c.t.toLowerCase(), c.nn ? 'NO' : 'YES', c.k || '', c.d === undefined ? null : (c.d === 'NOW' ? 'CURRENT_TIMESTAMP' : String(c.d)), c.ex || ''])};
    }
    case 'use': if(st.db.toLowerCase() !== SQL_DB) throw sqlErr(1049, '42000', "Unknown database '" + st.db + "'"); return {type:'ok', msg:'Database changed'};
    case 'explain': return runExplain(st.q);
    case 'begin': SQL_TXN_SNAPSHOT = JSON.stringify(DB); return {type:'ok', msg:'START TRANSACTION\nA snapshot of the database was saved. Run ROLLBACK to undo everything back to this point, or COMMIT to keep it.'};
    case 'commit': { const had = SQL_TXN_SNAPSHOT !== null; SQL_TXN_SNAPSHOT = null; return {type:'ok', msg:'COMMIT' + (had ? '' : ' (no transaction was open — nothing to commit)')}; }
    case 'rollback': {
      if(SQL_TXN_SNAPSHOT === null) return {type:'ok', msg:'ROLLBACK (no transaction was open — nothing to roll back)'};
      DB = JSON.parse(SQL_TXN_SNAPSHOT); SQL_TXN_SNAPSHOT = null; saveDB();
      return {type:'ok', msg:'ROLLBACK\nAll changes made since START TRANSACTION were discarded.'};
    }
    case 'denied': throw sqlErr(1142, '42000', st.cmd + ' command denied to user \'qa_tester\'@\'localhost\' for table (sandbox is read-write for data only)');
  }
  throw sqlErr(1064, '42000', 'Unsupported statement');
}
let SQL_TXN_SNAPSHOT = null;
function usesIndexedEq(node, alias, idxCols){
  if(!node) return false;
  if(node.type === 'bin' && node.op === '=' && node.l && node.l.type === 'col' && (node.l.table === alias || !node.l.table) && idxCols.includes(String(node.l.name).toLowerCase())) return true;
  if(node.type === 'bin' && (node.op === 'AND' || node.op === 'OR')) return usesIndexedEq(node.l, alias, idxCols) || usesIndexedEq(node.r, alias, idxCols);
  return false;
}
function runExplain(q){
  const cols = ['id', 'select_type', 'table', 'type', 'possible_keys', 'key', 'rows', 'Extra'];
  if(q.type === 'union') return {type:'rows', cols, rows:[[1, 'PRIMARY', '<union1,union2>', 'ALL', null, null, '?', 'Simulated plan for teaching purposes']]};
  if(!q.from) return {type:'rows', cols, rows:[[1, 'SIMPLE', null, null, null, null, null, 'No FROM clause']]};
  const rowsOut = []; let id = 1;
  const mainTable = resolveTable(q.from.table);
  const idxCols = SCHEMA[mainTable].filter(c => c.k === 'PRI' || c.k === 'UNI' || c.k === 'MUL').map(c => c.n);
  const usesIdx = q.where && usesIndexedEq(q.where, q.from.alias, idxCols);
  const extra1 = []; if(q.where) extra1.push('Using where'); if(q.group.length) extra1.push('Using temporary; Using filesort'); else if(q.order.length && !usesIdx) extra1.push('Using filesort');
  rowsOut.push([id, 'SIMPLE', mainTable, usesIdx ? 'ref' : 'ALL', idxCols.join(',') || null, usesIdx ? 'idx_guess' : null, DB[mainTable].length, extra1.join('; ') || null]);
  q.joins.forEach(j => { id++; const tn = resolveTable(j.ref.table); rowsOut.push([id, 'SIMPLE', tn, j.kind === 'LEFT' ? 'ALL' : 'eq_ref', null, j.kind === 'LEFT' ? null : 'PRIMARY', DB[tn].length, j.on ? 'Using where' : null]); });
  return {type:'rows', cols, rows:rowsOut, note:'This is a simulated query plan for learning EXPLAIN output — not a literal MySQL optimizer decision.'};
}
function execSQL(sql){
  const results = [];
  const stmts = splitSQL(sql);
  if(!stmts.length) return [{type:'error', msg:'ERROR 1065 (42000): Query was empty', sql:''}];
  for(const s of stmts){
    const t0 = performance.now();
    try {
      const st = new SqlParser(s).parseStatement();
      const r = runStmt(st); r.ms = (performance.now() - t0) / 1000; r.sql = s; results.push(r);
    } catch(e){
      if(e instanceof SQLError) results.push({type:'error', msg:'ERROR ' + e.code + ' (' + e.state + '): ' + e.message, sql:s});
      else results.push({type:'error', msg:'ERROR 2000 (HY000): ' + e.message, sql:s});
      break;
    }
  }
  return results;
}

/* ---------- tokens (JWT-shaped, 60 minute expiry) ---------- */
const b64u = s => btoa(unescape(encodeURIComponent(s))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const unb64u = s => decodeURIComponent(escape(atob(s.replace(/-/g, '+').replace(/_/g, '/'))));
function makeToken(u){
  const now = Math.floor(Date.now() / 1000);
  return b64u(JSON.stringify({alg:'HS256', typ:'JWT'})) + '.' + b64u(JSON.stringify({sub:u.id, email:u.email, role:u.role, iat:now, exp:now + 3600})) + '.' + b64u('qa-sandbox-signature');
}
function verifyToken(tok){
  try{
    const parts = tok.split('.');
    if(parts.length !== 3) return {error:'malformed token'};
    if(unb64u(parts[2]) !== 'qa-sandbox-signature') return {error:'invalid signature'};
    const pl = JSON.parse(unb64u(parts[1]));
    if(pl.exp < Date.now() / 1000) return {error:'token expired'};
    return {payload:pl};
  }catch(e){ return {error:'malformed token'}; }
}

function validateRegistration(d, needPhone){
  const e = {};
  const name = String(d.name == null ? '' : d.name).trim();
  if(!name) e.name = 'Full name is required'; else if(name.length < 2) e.name = 'Name must be at least 2 characters'; else if(name.length > 60) e.name = 'Name must be at most 60 characters';
  const email = String(d.email == null ? '' : d.email).trim();
  if(!email) e.email = 'Email is required'; else if(!EMAIL_RE.test(email)) e.email = 'Enter a valid email address';
  else if(DB.customers.some(c => c.email.toLowerCase() === email.toLowerCase())) e.email = 'This email is already registered';
  const phone = String(d.phone == null ? '' : d.phone).trim();
  if(!phone){ if(needPhone) e.phone = 'Phone number is required'; } else if(!/^\d{10}$/.test(phone)) e.phone = 'Phone must be exactly 10 digits';
  const pw = String(d.password == null ? '' : d.password);
  if(!pw) e.password = 'Password is required'; else if(pw.length < 8) e.password = 'Password must be at least 8 characters'; else if(!/[A-Z]/.test(pw)) e.password = 'Password needs at least one uppercase letter'; else if(!/\d/.test(pw)) e.password = 'Password needs at least one number';
  return e;
}
function authenticate(email, password){
  const u = DB.customers.find(c => c.email.toLowerCase() === String(email || '').trim().toLowerCase());
  if(!u || u.password !== password) return {err:{status:401, message:'Invalid email or password'}};
  if(u.status === 'blocked') return {err:{status:403, message:'Your account has been blocked. Please contact support.'}};
  return {user:u};
}
const pubUser = u => { const {password, ...rest} = u; return rest; };

api('GET', '/products', ({query}) => {
  let list = DB.products.filter(p => p.status === 'active');
  const page = query.page === undefined ? 1 : Number(query.page);
  const limit = query.limit === undefined ? 10 : Number(query.limit);
  if(!Number.isInteger(page) || page < 1) return E(400, 'Query param "page" must be a positive integer');
  if(!Number.isInteger(limit) || limit < 1 || limit > 50) return E(400, 'Query param "limit" must be an integer between 1 and 50');
  if(query.category_id !== undefined){ const c = Number(query.category_id); if(!Number.isInteger(c)) return E(400, 'Query param "category_id" must be an integer'); list = list.filter(p => p.category_id === c); }
  if(query.q){ const q = String(query.q).toLowerCase(); list = list.filter(p => (p.name + ' ' + (p.tags || '') + ' ' + (p.description || '')).toLowerCase().includes(q)); }
  if(query.min_price !== undefined){ const m = Number(query.min_price); if(isNaN(m)) return E(400, 'Query param "min_price" must be a number'); list = list.filter(p => p.price >= m); }
  if(query.max_price !== undefined){ const m = Number(query.max_price); if(isNaN(m)) return E(400, 'Query param "max_price" must be a number'); list = list.filter(p => p.price <= m); }
  if(query.sort !== undefined){
    const s = {price_asc:(a, b) => a.price - b.price, price_desc:(a, b) => b.price - a.price, name_asc:(a, b) => a.name.localeCompare(b.name), newest:(a, b) => b.id - a.id}[query.sort];
    if(!s) return E(400, 'Query param "sort" must be one of: price_asc, price_desc, name_asc, newest');
    list = list.slice().sort(s);
  }
  const total = list.length;
  return R(200, {page, limit, total, total_pages:Math.max(1, Math.ceil(total / limit)), data:list.slice((page - 1) * limit, page * limit).map(prodOut)});
});

const UP_ALLOWED = ['txt', 'csv', 'json', 'xml', 'pdf', 'png', 'jpg', 'jpeg', 'gif', 'docx', 'xlsx', 'zip'], UP_MAX = 1024 * 1024;

  if(f.size > UP_MAX) return {status:413, msg:'File "' + f.name + '" is too large (' + upSize(f.size) + '). Maximum size is 1 MB'};

/* ---------- request dispatcher (no artificial latency) ---------- */
async function apiCore(method, urlStr, headers, bodyText){
  let u;
  try{ u = new URL(urlStr); }catch(e){ return {network:'Invalid URL'}; }
  if(!/^https?:$/.test(u.protocol)) return {network:'Unsupported protocol "' + u.protocol + '"'};
  if(u.hostname !== API_HOST) return {network:'getaddrinfo ENOTFOUND ' + u.hostname + ' (only api.qasandbox.com is reachable while "Real internet requests" is switched off in the API Client)'};
  const hl = {}; Object.keys(headers || {}).forEach(k => { hl[k.toLowerCase()] = headers[k]; });
  const path = u.pathname.replace(/\/+$/, '') || '/';
  const base = {'Content-Type':'application/json; charset=utf-8', 'X-Request-Id':uid() + uid(), 'X-Powered-By':'QA-Sandbox/1.0', 'Cache-Control':'no-store', 'Date':new Date().toUTCString(), 'X-RateLimit-Limit':'1000', 'X-RateLimit-Remaining':String(rand(900, 999))};

    const text = res.data === null || res.data === undefined ? '' : JSON.stringify(res.data);
    if(res.status === 204) delete out['Content-Type'];
    return {status:res.status, statusText:statusText(res.status), headers:out, text};
  };
  /* ---- custom mock endpoints (Admin > API Mocks) — checked before built-in routes,
     so a tester can define ANY path + method + status code they want ---- */
  const mockPath = path.replace(/\/+$/, '') || '/';
  const mock = DB.api_mocks.find(m => m.status === 'active' && m.method === method && ('/' + m.path.replace(/^\/+/, '').replace(/\/+$/, '')) === mockPath);
  if(mock){
    if(mock.requires_auth === 'yes'){
      const ah = hl['authorization'];
      if(!ah) return done(E(401, 'Missing Authorization header. Use "Authorization: Bearer <token>"'));
      const m2 = /^Bearer\s+(.+)$/i.exec(ah);
      if(!m2) return done(E(401, 'Authorization header must use the Bearer scheme'));
      const v = verifyToken(m2[1].trim());
      if(v.error) return done(E(401, 'Invalid or expired token (' + v.error + ')'));
    }
    let data = null;
    if(mock.response_body && mock.response_body.trim()){
      try{ data = JSON.parse(mock.response_body); }
      catch(e){ return done(E(500, 'This mock\'s saved response body is not valid JSON: ' + e.message)); }
    }
    return done(R(Number(mock.status_code) || 200, data));
  }
  if(path !== API_PREFIX && !path.startsWith(API_PREFIX + '/')) return done(E(404, 'Route ' + method + ' ' + path + ' not found. All endpoints start with ' + API_PREFIX + ' (or match a custom mock you defined in Admin > API Mocks)', {path}));
  const rel = path.slice(API_PREFIX.length) || '/';
  const sameMethod = API_ROUTES.filter(r => r.re.test(rel));
  if(!sameMethod.length) return done(E(404, 'Route ' + method + ' ' + rel + ' not found', {path}));
  const route = sameMethod.find(r => r.method === method);
  if(!route){ const allow = sameMethod.map(r => r.method).join(', '); return done(R(405, {status:405, error:'Method Not Allowed', message:method + ' is not allowed on ' + rel + '. Allowed: ' + allow}, {Allow:allow})); }
  let user = null;
  if(route.auth){
    const ah = hl['authorization'];
    if(!ah) return done(E(401, 'Missing Authorization header. Use "Authorization: Bearer <token>"'));
    const m = /^Bearer\s+(.+)$/i.exec(ah);
    if(!m) return done(E(401, 'Authorization header must use the Bearer scheme'));
    const v = verifyToken(m[1].trim());
    if(v.error) return done(E(401, 'Invalid or expired token (' + v.error + ')'));
    user = DB.customers.find(c => c.id === v.payload.sub);
    if(!user) return done(E(401, 'User for this token no longer exists'));
    if(user.status === 'blocked') return done(E(403, 'Account is blocked'));
    if(route.auth === 'admin' && user.role !== 'admin') return done(E(403, 'Admin role required for this endpoint'));
  }
  let body = {};
  const rawIn = {text:'', parts:null, bin:null, ct:hl['content-type'] || ''};
  if(bodyText && typeof bodyText === 'object'){ if(bodyText.multipart) rawIn.parts = bodyText.multipart; else if(bodyText.binary) rawIn.bin = bodyText.binary; bodyText = ''; }
  else rawIn.text = bodyText === undefined || bodyText === null ? '' : String(bodyText);
  if(!route.raw && ['POST', 'PUT', 'PATCH'].includes(method) && (rawIn.parts || rawIn.bin || rawIn.text.trim() !== '')){

    const res = await route.fn({params, query:Object.fromEntries(u.searchParams), body, user, headers:hl, method, raw:rawIn});
    return done(res);
  }catch(e){
    return done(E(500, 'Unexpected server error: ' + (e && e.message ? e.message : e)));
  }
}
/* Postman-facing wrapper with realistic network latency */
const HTTP_TEXT = {200:'OK', 201:'Created', 202:'Accepted', 204:'No Content', 301:'Moved Permanently', 302:'Found', 304:'Not Modified', 400:'Bad Request', 401:'Unauthorized', 403:'Forbidden', 404:'Not Found', 405:'Method Not Allowed', 409:'Conflict', 415:'Unsupported Media Type', 422:'Unprocessable Entity', 429:'Too Many Requests', 500:'Internal Server Error', 502:'Bad Gateway', 503:'Service Unavailable'};
/* Real HTTP call made by the browser itself (used by the API Client for any host other than the sandbox). */
async function apiReal(method, url, headers, body){
  const t0 = performance.now(), ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 30000);
  let host = ''; try{ host = new URL(url).host; }catch(e){}
  try{
    const h = new Headers(); Object.entries(headers || {}).forEach(([k, v]) => { try{ h.set(k, v); }catch(e){} });
    let payload;
    if(body && typeof body === 'object'){
      if(body.multipart){ const fd = new FormData(); for(const p of body.multipart){ if(p.type === 'file') fd.append(p.key, await (await fetch(p.data)).blob(), p.name); else fd.append(p.key, p.value); } payload = fd; h.delete('Content-Type'); }

    } else if(body !== undefined && body !== '' && !['GET', 'HEAD'].includes(method)) payload = body;
    const r = await fetch(url, {method, headers:h, body:payload, signal:ctl.signal, credentials:'omit', redirect:'follow'});
    const text = await r.text(), hd = {}; r.headers.forEach((v, k) => { hd[k] = v; });
    return {status:r.status, statusText:r.statusText || HTTP_TEXT[r.status] || '', headers:hd, text, ms:Math.round(performance.now() - t0), size:text.length};
  }catch(e){
    return {network:e.name === 'AbortError' ? 'Request to ' + host + ' timed out after 30 seconds' : 'Could not get a response from ' + host + '. Possible reasons: the browser blocked it because the server does not allow cross-origin (CORS) calls, the server is offline or the name does not exist, or the URL is a mixed http/https request.', ms:Math.round(performance.now() - t0)};
  }finally{ clearTimeout(timer); }
}
async function apiHandle(method, url, headers, body, opts){
  let host = ''; try{ host = new URL(url).hostname; }catch(e){}
  if(opts && opts.real && host && host !== API_HOST) return await apiReal(method, url, headers, body);
  const t0 = performance.now();
  await sleep(rand(60, 220));
  const r = await apiCore(method, url, headers, body);
  const ms = Math.round(performance.now() - t0);
  if(r.network) return {network:r.network, ms};
  const size = r.text.length + Object.keys(r.headers).reduce((s, k) => s + k.length + String(r.headers[k]).length + 4, 0);
  return Object.assign(r, {ms, size});
}

function validateModule(tbl, body, mode, selfId){
  const errors = {}; const record = {};
  const dup = (col, val) => DB[tbl].some(r => r.id !== selfId && String(r[col]).toLowerCase() === String(val).toLowerCase());
  const dup2 = (c1, c2, v1, v2) => DB[tbl].some(r => r.id !== selfId && String(r[c1]).toLowerCase() === String(v1).toLowerCase() && String(r[c2]).toLowerCase() === String(v2).toLowerCase());
  switch(tbl){
    case 'categories': {
      const name = String(body.name || '').trim();
      if(!name) errors.name = 'Category name is required'; else if(name.length > 80) errors.name = 'Max 80 characters'; else if(dup('name', name)) errors.name = 'A category with this name already exists';
      let slug = slugify(body.slug || name);
      if(!slug) errors.slug = 'Slug is required'; else if(dup('slug', slug)) errors.slug = 'A category with this slug already exists';
      record.name = name; record.slug = slug; record.description = String(body.description || '').trim() || null; record.image = String(body.image || '').trim() || null;
      record.status = ['active', 'inactive'].includes(body.status) ? body.status : 'active';
      break;
    }
    case 'products': {
      const name = String(body.name || '').trim();
      if(!name) errors.name = 'Product name is required'; else if(name.length > 150) errors.name = 'Max 150 characters';
      const catId = Number(body.category_id);
      if(!Number.isInteger(catId) || !byId('categories', catId)) errors.category_id = 'Please select a valid category';
      const price = Number(body.price);
      if(body.price === '' || body.price === undefined || isNaN(price) || price < 0) errors.price = 'Price must be a number ≥ 0'; else if(price > 999999) errors.price = 'Price is too large';
      let oldPrice = null;
      if(body.old_price !== '' && body.old_price !== undefined && body.old_price !== null){ oldPrice = Number(body.old_price); if(isNaN(oldPrice) || oldPrice < 0) errors.old_price = 'Compare-at price must be a number ≥ 0'; }
      const stock = Number(body.stock);
      if(body.stock === '' || body.stock === undefined || !Number.isInteger(stock) || stock < 0) errors.stock = 'Stock must be a whole number ≥ 0';
      const sku = String(body.sku || '').trim();
      if(sku && dup('sku', sku)) errors.sku = 'A product with this SKU already exists';
      record.name = name; record.category_id = catId; record.price = isNaN(price) ? 0 : r2(price); record.old_price = oldPrice === null ? null : r2(oldPrice);
      record.stock = isNaN(stock) ? 0 : stock; record.sku = sku || null; record.description = String(body.description || '').trim() || null;
      record.image = String(body.image || '').trim() || null; record.tags = String(body.tags || '').trim() || null;
      record.status = ['active', 'inactive'].includes(body.status) ? body.status : 'active';
      if(mode === 'add') record.created_at = nowStr();
      break;
    }
    case 'customers': {
      const name = String(body.name || '').trim();
      if(!name) errors.name = 'Full name is required'; else if(name.length < 2) errors.name = 'Name must be at least 2 characters';
      const email = String(body.email || '').trim();
      if(!email) errors.email = 'Email is required'; else if(!EMAIL_RE.test(email)) errors.email = 'Enter a valid email address'; else if(dup('email', email)) errors.email = 'This email is already registered';
      if(mode === 'add'){
        const pw = String(body.password || '');
        if(!pw) errors.password = 'Password is required'; else if(pw.length < 8) errors.password = 'Password must be at least 8 characters'; else if(!/[A-Z]/.test(pw)) errors.password = 'Needs at least one uppercase letter'; else if(!/\d/.test(pw)) errors.password = 'Needs at least one number';
        record.password = pw;
      }
      const phone = String(body.phone || '').trim();
      if(phone && !/^\d{7,15}$/.test(phone)) errors.phone = 'Phone must be 7-15 digits';
      record.name = name; record.email = email; record.phone = phone || null;
      record.role = ['customer', 'admin'].includes(body.role) ? body.role : 'customer';
      record.status = ['active', 'blocked'].includes(body.status) ? body.status : 'active';
      if(mode === 'add') record.created_at = nowStr();
      break;
    }
    case 'reviews': {
      const pid = Number(body.product_id);
      if(!Number.isInteger(pid) || !byId('products', pid)) errors.product_id = 'Please select a valid product';
      const who = String(body.customer_name || '').trim();
      if(!who) errors.customer_name = 'Customer name is required';
      const rating = Number(body.rating);
      if(!Number.isInteger(rating) || rating < 1 || rating > 5) errors.rating = 'Rating must be a whole number from 1 to 5';
      const comment = String(body.comment || '').trim();
      if(comment.length > 0 && comment.length < 5) errors.comment = 'Comment should be at least 5 characters';
      record.product_id = pid; record.customer_name = who; record.rating = isNaN(rating) ? 0 : rating; record.comment = comment || null;
      record.status = ['pending', 'approved', 'rejected'].includes(body.status) ? body.status : 'pending';
      if(mode === 'add') record.created_at = nowStr();
      break;
    }
    case 'api_mocks': {
      const method = String(body.method || '').toUpperCase();
      if(!['GET', 'POST', 'PUT', 'PATCH', 'DELETE'].includes(method)) errors.method = 'Choose a valid HTTP method';
      let path = String(body.path || '').trim();
      if(!path) errors.path = 'Path is required'; else { if(!path.startsWith('/')) path = '/' + path; path = path.replace(/\/+$/, '') || '/'; }
      const code = Number(body.status_code);
      if(!Number.isInteger(code) || code < 100 || code > 599) errors.status_code = 'Status code must be an integer between 100 and 599';
      if(path && method && dup2('method', 'path', method, path)) errors.path = 'A mock with this method + path already exists';
      const rb = String(body.response_body || '').trim();
      if(rb){ try{ JSON.parse(rb); }catch(e){ errors.response_body = 'Response body must be valid JSON: ' + e.message; } }
      record.method = method; record.path = path; record.status_code = isNaN(code) ? 200 : code;
      record.requires_auth = body.requires_auth === 'yes' ? 'yes' : 'no';
      record.response_body = rb || null; record.description = String(body.description || '').trim() || null;
      record.status = ['active', 'inactive'].includes(body.status) ? body.status : 'active';
      if(mode === 'add') record.created_at = nowStr();
      break;
    }
    case 'cms_pages': {
      const title = String(body.title || '').trim();
      if(!title) errors.title = 'Title is required';
      let slug = slugify(body.slug || title);
      if(!slug) errors.slug = 'Slug is required'; else if(dup('slug', slug)) errors.slug = 'A page with this slug already exists';
      record.title = title; record.slug = slug; record.content = String(body.content || '');
      record.status = ['active', 'inactive'].includes(body.status) ? body.status : 'active';
      if(mode === 'add') record.created_at = nowStr();
      break;
    }
  }
  return {errors, record};
}

function openModal(html, opts = {}){
